<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDFテキスト抽出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1B2733; --sub:#5A6878; --line:#CBD4DE;
  --red:#E0301E; --blue:#2B5C8A; --blue-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
    --red:#FF5040; --blue:#5B93C9; --blue-ink:#0E1620;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
  --red:#FF5040; --blue:#5B93C9; --blue-ink:#0E1620;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:14.5px; line-height:1.5;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
header{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; flex:none;
  padding:12px 18px 6px;
}
.back-link{
  flex:none; display:inline-flex; align-items:center; gap:4px;
  font-size:12.5px; color:var(--sub); text-decoration:none;
  padding:4px 9px; border-radius:5px; border:1px solid var(--line);
  order:-1;
}
.back-link:hover{border-color:var(--blue); color:var(--ink)}
h1{
  margin:0; font-size:19px; font-weight:700; letter-spacing:.02em;
  display:flex; align-items:center; gap:8px;
}
h1 .mark{
  width:18px; height:14px; border:2.5px solid var(--red); position:relative; display:inline-block; flex:none;
}
h1 .mark::after{
  content:""; position:absolute; right:-10px; top:-8px; width:10px; height:8px;
  border:2px solid var(--red); background:var(--bg);
}
header p{margin:0; color:var(--sub); font-size:12.5px}

main{
  display:grid; grid-template-columns:280px minmax(0,1fr); gap:1px;
  background:var(--line); flex:1; min-height:0; overflow:hidden;
}
@media (max-width: 760px){
  main{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,40vh) minmax(240px,1fr);
  }
}
.panel{background:var(--panel); min-height:0; display:flex; flex-direction:column}
.panel-pad{padding:12px; display:flex; flex-direction:column; gap:10px; overflow:auto}

.dropzone{
  border:2px dashed var(--line); border-radius:8px; padding:18px 10px; text-align:center;
  color:var(--sub); font-size:12.5px; cursor:pointer; transition:background-color .1s ease;
}
.dropzone:hover, .dropzone.drag-over{background:var(--bg); border-color:var(--blue)}
.dropzone b{display:block; color:var(--ink); font-size:13.5px; margin-bottom:2px}

.tool-group-label{font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.03em; margin:4px 0 0}
hr.sep{border:0; border-top:1px solid var(--line); margin:4px 0}

.file-list{display:flex; flex-direction:column; gap:6px}
.file-item{
  display:flex; flex-direction:column; gap:3px; padding:8px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--bg); cursor:pointer; text-align:left;
  font:inherit; color:var(--ink); width:100%;
}
.file-item:hover{border-color:var(--blue)}
.file-item[aria-pressed="true"]{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
.file-item .fname{font-size:13px; font-weight:700; word-break:break-all}
.file-item .fmeta{font-size:11.5px; color:var(--sub)}
.file-item .fmeta.warn{color:var(--red)}
.file-item .fremove{
  align-self:flex-end; font:inherit; font-size:11px; color:var(--sub); background:none; border:0; cursor:pointer; padding:2px 4px;
}
.file-item .fremove:hover{color:var(--red)}

.check-row{display:flex; align-items:center; gap:7px; font-size:13px}
.check-row input{width:15px; height:15px}

button.ghost-sm{
  font:inherit; font-size:12.5px; padding:6px 9px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); cursor:pointer;
}
button.ghost-sm:hover{border-color:var(--blue)}
button.ghost-sm:disabled{opacity:.4; cursor:not-allowed}
button.primary{
  font:inherit; font-size:13px; padding:8px 10px; border-radius:6px; border:1px solid var(--red);
  background:var(--red); color:#fff; cursor:pointer; font-weight:700;
}
button.primary:hover{opacity:.9}
button.primary:disabled{opacity:.4; cursor:not-allowed; background:var(--sub); border-color:var(--sub)}
button.danger{
  font:inherit; font-size:13px; padding:7px 10px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); color:var(--red); cursor:pointer;
}
button.danger:hover{border-color:var(--red); background:color-mix(in srgb, var(--red) 8%, transparent)}
.btn-row{display:flex; gap:6px; flex-wrap:wrap}

.viewer{display:flex; flex-direction:column; min-height:0; height:100%}
.viewer-head{
  flex:none; padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.viewer-head h2{margin:0; font-size:14px; font-weight:700; word-break:break-all}
.viewer-head .vmeta{font-size:12px; color:var(--sub)}
.viewer-empty{flex:1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; text-align:center; padding:20px}
.tables-panel{
  flex:none; display:flex; flex-direction:column; gap:6px; padding:10px 14px;
  border-bottom:1px solid var(--line); max-height:28vh; overflow:auto;
}
.tables-panel-label{font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.03em}
.table-card{
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:6px;
  border:1px solid var(--line); background:var(--bg); flex-wrap:wrap;
}
.table-card .tmeta{font-size:12.5px; flex:1; min-width:120px}
.table-card .tmeta b{font-variant-numeric:tabular-nums}
textarea#textOut{
  flex:1; min-height:0; width:100%; resize:none; border:0; outline:0;
  padding:14px; font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:13px; line-height:1.6; background:var(--panel); color:var(--ink);
}

#status{
  flex:none; padding:6px 14px; font-size:12.5px; color:var(--sub); min-height:1.6em;
  background:var(--panel); border-top:1px solid var(--line);
}
#status.error{color:var(--red)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <a class="back-link" href="../" aria-label="ツール一覧に戻る">← 一覧</a>
  <h1><span class="mark" aria-hidden="true"></span>PDFテキスト抽出</h1>
  <p>PDFに埋め込まれた文字データ(テキスト層)だけを抽出します。OCRは行わないため、スキャン画像のみのページからは抽出できません。罫線のある表はCSV形式に変換し、表ごとにExcel形式でもダウンロードできます。ファイルはサーバーに送信されず、処理はすべて端末内で完結します。</p>
</header>

<main>
  <section class="panel">
    <div class="panel-pad">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="PDFを選択またはドロップ">
        <b>PDFをドロップ</b>
        またはクリックして選択(複数可)
      </div>
      <input type="file" id="fileInput" accept="application/pdf" multiple class="sr">

      <hr class="sep">
      <p class="tool-group-label" id="fileListLabel">読み込んだPDF(0件)</p>
      <div class="file-list" id="fileList"></div>

      <hr class="sep">
      <label class="check-row"><input type="checkbox" id="optPageMarkers" checked>ページ区切りを挿入</label>
      <label class="check-row"><input type="checkbox" id="optPageNumbers" checked>ページ番号を表示</label>
      <label class="check-row"><input type="checkbox" id="optDetectTables" checked>検出した表をCSV形式で表示</label>

      <hr class="sep">
      <div class="btn-row">
        <button type="button" class="ghost-sm" id="copyBtn" disabled>📋 コピー</button>
        <button type="button" class="ghost-sm" id="downloadTxtBtn" disabled>⬇ .txtで保存</button>
      </div>
      <button type="button" class="ghost-sm" id="downloadZipBtn" disabled>⬇ 全ファイルをZIPで保存</button>
      <button type="button" class="danger" id="clearAllBtn" disabled>すべて消去</button>
    </div>
  </section>

  <section class="panel">
    <div class="viewer">
      <div class="viewer-head" id="viewerHead" style="display:none">
        <h2 id="viewerFileName"></h2>
        <span class="vmeta" id="viewerMeta"></span>
      </div>
      <div class="tables-panel" id="tablesPanel" style="display:none">
        <p class="tables-panel-label" id="tablesPanelLabel"></p>
      </div>
      <p class="viewer-empty" id="viewerEmpty">左の「PDFをドロップ」からファイルを読み込むと、ここに抽出したテキストが表示されます。</p>
      <textarea id="textOut" style="display:none" spellcheck="false" placeholder=""></textarea>
    </div>
  </section>
</main>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  const statusEl = $('status');
  const setStatus = (msg, isError = false) => {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  };

  // files: [{ id, name, status:'loading'|'done'|'error', errorMsg, pageCount, textPageCount, tables:[{globalIndex,pageNum,rows}],
  //           pages:[{num, empty, blocks:[{kind:'line',y,text}|{kind:'table',y,rows,tableIndex}]}] }]
  const files = [];
  let nextFileId = 1;
  let activeFileId = null;

  // ---------- PDFのテキスト層からの抽出(OCRは行わない) ----------
  // pdf.jsのgetTextContent()は文字アイテムの配列(座標付き)を返すだけで改行情報を持たないため、
  // Y座標でまとめて行を作り、行内はX座標順に並べ替えて読み取り順に再構成している。
  // 複数段組みなど複雑なレイアウトでは読み取り順が崩れる場合がある(簡易ヒューリスティックのため)。
  //
  // 文字間のスペース判定は、固定の絶対しきい値(例:1pt)ではなく「そのアイテムのフォントサイズに
  // 対する相対しきい値」で行う。Word/Illustrator等が書き出すPDFは1単語の中でも文字ごとに個別の
  // 描画命令(字送り調整)を持つことが多く、絶対しきい値だと単語の途中にまで余計なスペースが
  // 入ってしまうため(実際に発生していた不具合)。
  function fontSizeOf(item){
    const fs = Math.hypot(item.transform[2], item.transform[3]);
    if (fs > 0.01) return fs;
    const fsAlt = Math.hypot(item.transform[0], item.transform[1]);
    return fsAlt > 0.01 ? fsAlt : 10;
  }

  function linesFromItems(items){
    if (!items.length) return [];
    const lines = [];
    for (const item of items){
      const x = item.transform[4], y = item.transform[5];
      const fs = fontSizeOf(item);
      let line = lines.find(l => Math.abs(l.y - y) <= Math.max(1.5, l.fontSize * 0.35));
      if (!line){ line = { y, fontSize: fs, parts: [] }; lines.push(line); }
      else if (fs > line.fontSize) line.fontSize = fs;
      line.parts.push({ x, str: item.str, width: item.width || 0, fs });
    }
    lines.sort((a, b) => b.y - a.y); // PDF座標はY上向きなので降順=上から下
    return lines.map(line => {
      line.parts.sort((a, b) => a.x - b.x);
      let text = '', prevEnd = null, prevFs = line.fontSize;
      for (const part of line.parts){
        if (prevEnd !== null){
          const gap = part.x - prevEnd;
          const threshold = Math.max(1, prevFs * 0.22);
          if (gap > threshold && !/\s$/.test(text) && !/^\s/.test(part.str)) text += ' ';
        }
        text += part.str;
        prevEnd = part.x + part.width;
        prevFs = part.fs || prevFs;
      }
      return { y: line.y, text: text.trimEnd() };
    });
  }

  // ---------- 表(罫線)の検出 ----------
  // ページを一度キャンバスに描画し、ピクセル単位で「長く連続した暗い直線」を走査することで
  // 罫線を検出する(PDFの描画命令を直接解析するより、pdf.js標準のrender()だけで完結し確実)。
  // 交差する横線・縦線の集合を連結成分としてグループ化し、2本以上の横線×2本以上の縦線が
  // 作る格子をひとつの表とみなす。罫線のない(余白だけで区切られた)表は検出対象外。
  async function detectTableGrids(page){
    const scale = 2;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.ceil(viewport.width));
    canvas.height = Math.max(1, Math.ceil(viewport.height));
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    await page.render({ canvasContext: ctx, viewport }).promise;
    const W = canvas.width, H = canvas.height;
    const data = ctx.getImageData(0, 0, W, H).data;
    const isDark = (x, y) => {
      const i = (y * W + x) * 4;
      if (data[i + 3] < 10) return false;
      return (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) < 200;
    };
    const MIN_LINE_PX = Math.round(18 * scale);

    const hCandidates = [];
    for (let y = 0; y < H; y++){
      let runStart = -1, bestStart = -1, bestLen = 0;
      for (let x = 0; x <= W; x++){
        const dark = x < W && isDark(x, y);
        if (dark){ if (runStart === -1) runStart = x; }
        else if (runStart !== -1){ const len = x - runStart; if (len > bestLen){ bestLen = len; bestStart = runStart; } runStart = -1; }
      }
      if (bestLen >= MIN_LINE_PX) hCandidates.push({ y, x1: bestStart, x2: bestStart + bestLen });
    }
    const vCandidates = [];
    for (let x = 0; x < W; x++){
      let runStart = -1, bestStart = -1, bestLen = 0;
      for (let y = 0; y <= H; y++){
        const dark = y < H && isDark(x, y);
        if (dark){ if (runStart === -1) runStart = y; }
        else if (runStart !== -1){ const len = y - runStart; if (len > bestLen){ bestLen = len; bestStart = runStart; } runStart = -1; }
      }
      if (bestLen >= MIN_LINE_PX) vCandidates.push({ x, y1: bestStart, y2: bestStart + bestLen });
    }

    function mergeLines(cands, posKey, aKey, bKey){
      cands.sort((p, q) => p[posKey] - q[posKey]);
      const merged = [];
      for (const c of cands){
        const last = merged[merged.length - 1];
        if (last && c[posKey] - last[posKey] <= 3){
          last[aKey] = Math.min(last[aKey], c[aKey]);
          last[bKey] = Math.max(last[bKey], c[bKey]);
        } else {
          merged.push({ ...c });
        }
      }
      return merged;
    }
    const hLines = mergeLines(hCandidates, 'y', 'x1', 'x2');
    const vLines = mergeLines(vCandidates, 'x', 'y1', 'y2');
    if (hLines.length < 2 || vLines.length < 2) return [];

    const EPS = 4;
    const n = hLines.length + vLines.length;
    const parent = Array.from({ length: n }, (_, i) => i);
    const find = i => { while (parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const union = (i, j) => { const a = find(i), b = find(j); if (a !== b) parent[a] = b; };
    for (let hi = 0; hi < hLines.length; hi++){
      for (let vi = 0; vi < vLines.length; vi++){
        const h = hLines[hi], v = vLines[vi];
        if (v.x >= h.x1 - EPS && v.x <= h.x2 + EPS && h.y >= v.y1 - EPS && h.y <= v.y2 + EPS) union(hi, hLines.length + vi);
      }
    }
    const groups = new Map();
    for (let i = 0; i < n; i++){
      const r = find(i);
      if (!groups.has(r)) groups.set(r, { h: [], v: [] });
      if (i < hLines.length) groups.get(r).h.push(hLines[i]); else groups.get(r).v.push(vLines[i - hLines.length]);
    }

    const grids = [];
    for (const { h, v } of groups.values()){
      if (h.length < 2 || v.length < 2) continue;
      h.sort((a, b) => a.y - b.y);
      v.sort((a, b) => a.x - b.x);
      // 1行×1列(単なる四角い枠線)は表ではないので除外する。セル数2以上(2行以上または2列以上)のみ表として扱う
      if ((h.length - 1) * (v.length - 1) < 2) continue;
      const rows = h.map(line => viewport.convertToPdfPoint(0, line.y)[1]);
      const cols = v.map(line => viewport.convertToPdfPoint(line.x, 0)[0]);
      // セルが不自然に細かい(数pt未満)場合は、写真やノイズの多いページを誤って格子と
      // 認識している可能性が高いため除外する(実際にテスト中に発生した誤検出への対策)
      let minRowH = Infinity, minColW = Infinity;
      for (let r = 0; r < rows.length - 1; r++) minRowH = Math.min(minRowH, Math.abs(rows[r] - rows[r + 1]));
      for (let c = 0; c < cols.length - 1; c++) minColW = Math.min(minColW, Math.abs(cols[c + 1] - cols[c]));
      if (minRowH < 4 || minColW < 4) continue;
      grids.push({ rows, cols });
    }
    return grids;
  }

  function csvEscapeField(s){
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function rowsToCsv(rows){
    return rows.map(row => row.map(csvEscapeField).join(',')).join('\n');
  }

  // ページ全体を「自由なテキスト行」と「検出した表」が混在する、Y位置順のブロック列として再構成する
  async function extractPageContent(page, detectTables){
    const content = await page.getTextContent();
    const items = content.items.filter(it => it.str !== undefined && it.str !== '');

    const grids = detectTables ? await detectTableGrids(page) : [];
    const gridCellItems = grids.map(g => Array.from({ length: g.rows.length - 1 }, () => Array.from({ length: g.cols.length - 1 }, () => [])));
    const assignedIdx = new Set();

    items.forEach((item, idx) => {
      const x = item.transform[4], y = item.transform[5];
      for (let gi = 0; gi < grids.length; gi++){
        const g = grids[gi];
        if (x < g.cols[0] - 2 || x > g.cols[g.cols.length - 1] + 2 || y > g.rows[0] + 2 || y < g.rows[g.rows.length - 1] - 2) continue;
        let ri = -1, ci = -1;
        for (let r = 0; r < g.rows.length - 1; r++){ if (y <= g.rows[r] + 1 && y >= g.rows[r + 1] - 1){ ri = r; break; } }
        for (let c = 0; c < g.cols.length - 1; c++){ if (x >= g.cols[c] - 1 && x <= g.cols[c + 1] + 1){ ci = c; break; } }
        if (ri >= 0 && ci >= 0){ gridCellItems[gi][ri][ci].push(item); assignedIdx.add(idx); break; }
      }
    });

    const freeItems = items.filter((it, idx) => !assignedIdx.has(idx));
    const freeLines = linesFromItems(freeItems).map(l => ({ kind: 'line', y: l.y, text: l.text }));

    const tableBlocks = grids.map((g, gi) => ({
      kind: 'table',
      y: g.rows[0],
      rows: gridCellItems[gi].map(rowCells => rowCells.map(cellItems => linesFromItems(cellItems).map(l => l.text).join(' ').trim())),
    }));

    const blocks = [...freeLines, ...tableBlocks].sort((a, b) => b.y - a.y);
    return blocks;
  }

  function composePageText(page, detectTables){
    const parts = [];
    for (const b of page.blocks){
      if (b.kind === 'line'){ if (b.text) parts.push(b.text); }
      else if (detectTables) parts.push(rowsToCsv(b.rows));
      else parts.push(b.rows.map(row => row.join('  ')).join('\n'));
    }
    return parts.join('\n').trim();
  }

  async function loadFile(file){
    const entry = { id: nextFileId++, name: file.name, status: 'loading', errorMsg: '', pageCount: 0, textPageCount: 0, pages: [], tables: [] };
    files.push(entry);
    renderFileList();
    if (activeFileId === null){ activeFileId = entry.id; }
    renderViewer();

    try {
      const buf = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      entry.pageCount = doc.numPages;
      for (let i = 1; i <= doc.numPages; i++){
        const page = await doc.getPage(i);
        const blocks = await extractPageContent(page, true);
        for (const b of blocks){
          if (b.kind === 'table'){
            b.tableIndex = entry.tables.length;
            entry.tables.push({ globalIndex: entry.tables.length + 1, pageNum: i, rows: b.rows });
          }
        }
        const empty = blocks.every(b => b.kind === 'table' ? b.rows.every(r => r.every(c => !c)) : !b.text);
        if (!empty) entry.textPageCount++;
        entry.pages.push({ num: i, empty, blocks });
        renderFileList(); // ページ数が多い場合に進捗が見えるよう都度更新
      }
      entry.status = 'done';
      const tableNote = entry.tables.length ? `、表${entry.tables.length}個を検出` : '';
      setStatus(`${file.name}: ${entry.pageCount}ページ中${entry.textPageCount}ページでテキストを検出しました${tableNote}。`);
    } catch (err){
      entry.status = 'error';
      if (err && err.name === 'PasswordException'){
        entry.errorMsg = 'パスワードで保護されたPDFは非対応です。';
      } else {
        entry.errorMsg = '読み込みに失敗しました(破損している、またはPDF以外のファイルの可能性があります)。';
      }
      console.error('PDF読み込みエラー:', file.name, err);
      setStatus(`${file.name}: ${entry.errorMsg}`, true);
    }
    renderFileList();
    renderViewer();
    updateButtons();
  }

  function fileById(id){ return files.find(f => f.id === id); }

  function composeText(entry){
    const showMarkers = $('optPageMarkers').checked;
    const showNumbers = $('optPageNumbers').checked;
    const detectTables = $('optDetectTables').checked;
    const parts = [];
    for (const p of entry.pages){
      if (showMarkers){
        const label = showNumbers ? `--- ページ ${p.num} ---` : '---';
        parts.push(p.empty ? `${label}(テキストなし)` : label);
      }
      if (!p.empty) parts.push(composePageText(p, detectTables));
    }
    return parts.join('\n\n').trim();
  }

  // ---------- ファイル一覧 ----------
  const fileListEl = $('fileList');
  const fileListLabel = $('fileListLabel');
  function renderFileList(){
    fileListLabel.textContent = `読み込んだPDF(${files.length}件)`;
    fileListEl.innerHTML = '';
    for (const entry of files){
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'file-item';
      item.setAttribute('aria-pressed', entry.id === activeFileId ? 'true' : 'false');

      const fname = document.createElement('div');
      fname.className = 'fname';
      fname.textContent = entry.name;
      item.appendChild(fname);

      const fmeta = document.createElement('div');
      fmeta.className = 'fmeta';
      if (entry.status === 'loading'){
        fmeta.textContent = entry.pageCount ? `解析中… (${entry.pages.length}/${entry.pageCount}ページ)` : '読み込み中…';
      } else if (entry.status === 'error'){
        fmeta.textContent = entry.errorMsg;
        fmeta.classList.add('warn');
      } else {
        fmeta.textContent = `${entry.pageCount}ページ中${entry.textPageCount}ページでテキストを検出`;
        if (entry.textPageCount === 0) fmeta.classList.add('warn');
      }
      item.appendChild(fmeta);

      item.addEventListener('click', () => { activeFileId = entry.id; renderFileList(); renderViewer(); updateButtons(); });
      fileListEl.appendChild(item);

      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'fremove';
      rm.textContent = '削除';
      rm.addEventListener('click', (e) => { e.stopPropagation(); removeFile(entry.id); });
      item.appendChild(rm);
    }
  }

  function removeFile(id){
    const idx = files.findIndex(f => f.id === id);
    if (idx === -1) return;
    files.splice(idx, 1);
    if (activeFileId === id) activeFileId = files.length ? files[0].id : null;
    renderFileList(); renderViewer(); updateButtons();
  }

  // ---------- ビューア ----------
  const viewerHead = $('viewerHead');
  const viewerEmpty = $('viewerEmpty');
  const textOut = $('textOut');
  const tablesPanel = $('tablesPanel');

  function xlsxFilenameForTable(entry, table){
    return `${baseName(entry.name)}_表${table.globalIndex}_p${table.pageNum}.xlsx`;
  }

  function downloadTableAsXlsx(entry, table){
    const ws = XLSX.utils.aoa_to_sheet(table.rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `表${table.globalIndex}`.slice(0, 31));
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    downloadBlob(new Blob([wbout], { type: 'application/octet-stream' }), xlsxFilenameForTable(entry, table));
    setStatus(`${xlsxFilenameForTable(entry, table)} をダウンロードしました。`);
  }

  function renderTablesPanel(entry){
    if (!entry || entry.status !== 'done' || !entry.tables.length){
      tablesPanel.style.display = 'none';
      tablesPanel.innerHTML = '<p class="tables-panel-label" id="tablesPanelLabel"></p>';
      return;
    }
    tablesPanel.style.display = 'flex';
    tablesPanel.innerHTML = '';
    const label = document.createElement('p');
    label.className = 'tables-panel-label';
    label.textContent = `検出した表(${entry.tables.length}個、罫線のある表のみ)`;
    tablesPanel.appendChild(label);
    for (const table of entry.tables){
      const card = document.createElement('div');
      card.className = 'table-card';
      const meta = document.createElement('span');
      meta.className = 'tmeta';
      const rowCount = table.rows.length, colCount = table.rows[0] ? table.rows[0].length : 0;
      meta.innerHTML = `表${table.globalIndex} <span style="color:var(--sub)">(p.${table.pageNum}、<b>${rowCount}</b>行×<b>${colCount}</b>列)</span>`;
      card.appendChild(meta);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ghost-sm';
      btn.textContent = '⬇ Excel形式';
      btn.addEventListener('click', () => downloadTableAsXlsx(entry, table));
      card.appendChild(btn);
      tablesPanel.appendChild(card);
    }
  }

  function renderViewer(){
    const entry = fileById(activeFileId);
    if (!entry){
      viewerHead.style.display = 'none';
      viewerEmpty.style.display = 'flex';
      textOut.style.display = 'none';
      renderTablesPanel(null);
      return;
    }
    viewerHead.style.display = 'flex';
    $('viewerFileName').textContent = entry.name;
    const metaEl = $('viewerMeta');
    if (entry.status === 'loading') metaEl.textContent = '解析中…';
    else if (entry.status === 'error') metaEl.textContent = entry.errorMsg;
    else metaEl.textContent = `${entry.pageCount}ページ中${entry.textPageCount}ページでテキストを検出`;

    renderTablesPanel(entry);

    if (entry.status === 'done'){
      viewerEmpty.style.display = 'none';
      textOut.style.display = 'block';
      textOut.value = composeText(entry);
    } else {
      viewerEmpty.style.display = 'flex';
      viewerEmpty.textContent = entry.status === 'error' ? entry.errorMsg : '解析中…';
      textOut.style.display = 'none';
    }
  }

  $('optPageMarkers').addEventListener('change', renderViewer);
  $('optPageNumbers').addEventListener('change', renderViewer);
  $('optDetectTables').addEventListener('change', renderViewer);

  // ---------- ボタン類 ----------
  function updateButtons(){
    const entry = fileById(activeFileId);
    const hasText = entry && entry.status === 'done';
    $('copyBtn').disabled = !hasText;
    $('downloadTxtBtn').disabled = !hasText;
    $('downloadZipBtn').disabled = files.filter(f => f.status === 'done').length < 2;
    $('clearAllBtn').disabled = files.length === 0;
  }

  function baseName(name){ return name.replace(/\.pdf$/i, ''); }

  $('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(textOut.value);
      setStatus('クリップボードにコピーしました。');
    } catch (err){
      textOut.select();
      document.execCommand('copy');
      setStatus('クリップボードにコピーしました。');
    }
  });

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  $('downloadTxtBtn').addEventListener('click', () => {
    const entry = fileById(activeFileId);
    if (!entry || entry.status !== 'done') return;
    const blob = new Blob([textOut.value], { type: 'text/plain;charset=utf-8' });
    downloadBlob(blob, `${baseName(entry.name)}.txt`);
    setStatus(`${baseName(entry.name)}.txt をダウンロードしました。`);
  });

  $('downloadZipBtn').addEventListener('click', async () => {
    const done = files.filter(f => f.status === 'done');
    if (done.length < 2) return;
    const zip = new JSZip();
    const usedNames = new Set();
    for (const entry of done){
      let name = `${baseName(entry.name)}.txt`;
      let i = 2;
      while (usedNames.has(name)){ name = `${baseName(entry.name)}_${i++}.txt`; }
      usedNames.add(name);
      zip.file(name, composeText(entry));
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(blob, 'pdf-text-extract.zip');
    setStatus(`${done.length}件のテキストをZIPでダウンロードしました。`);
  });

  $('clearAllBtn').addEventListener('click', () => {
    if (!files.length) return;
    if (!confirm('読み込んだすべてのPDFを消去します。よろしいですか?')) return;
    files.length = 0;
    activeFileId = null;
    renderFileList(); renderViewer(); updateButtons();
    setStatus('すべて消去しました。');
  });

  // ---------- ファイル選択・ドラッグ&ドロップ ----------
  const dropzone = $('dropzone');
  const fileInput = $('fileInput');
  function handleFiles(fileListObj){
    const list = [...fileListObj].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
    if (!list.length){ setStatus('PDFファイルを選択してください。', true); return; }
    for (const f of list) loadFile(f);
  }
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.add('drag-over');
  }));
  ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.remove('drag-over');
  }));
  dropzone.addEventListener('drop', e => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
  // ページ全体へのドロップでもブラウザ既定の「ファイルを開く」動作に飛ばないようにする
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { if (e.target === document.body || e.target === document.documentElement) e.preventDefault(); });

  setStatus('PDFを選択またはドロップしてください。');
})();
</script>
</body>
</html>
