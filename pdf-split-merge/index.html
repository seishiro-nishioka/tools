<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF分割・結合ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1B2733; --sub:#5A6878; --line:#CBD4DE;
  --red:#E0301E; --blue:#2B5C8A; --blue-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
    --red:#FF5040; --blue:#5B93C9; --blue-ink:#0E1620;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
  --red:#FF5040; --blue:#5B93C9; --blue-ink:#0E1620;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
header{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:18px 22px 10px;
}
h1{
  margin:0; font-size:22px; font-weight:700; letter-spacing:.02em;
  display:flex; align-items:center; gap:10px;
}
h1 .mark{
  width:22px; height:16px; border:2.5px solid var(--red); position:relative; display:inline-block;
}
h1 .mark::after{
  content:""; position:absolute; right:-12px; top:-9px; width:12px; height:9px;
  border:2px solid var(--red); background:var(--bg);
}
header p{margin:0; color:var(--sub); font-size:13.5px}

main{
  display:grid; grid-template-columns:280px minmax(0,1fr); gap:18px;
  padding:6px 22px 28px; align-items:start;
}
@media (max-width:860px){ main{grid-template-columns:1fr} }

section.box{
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px;
}
h2{font-size:14.5px; margin:0; font-weight:700}

/* ---------- メディアプール ---------- */
.pool{display:flex; flex-direction:column; gap:10px; min-width:0}
.pool-header{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
.pool-actions{display:flex; gap:6px; flex-wrap:wrap}
.pool-list{
  display:flex; flex-direction:column; gap:8px; max-height:64vh; overflow:auto;
  border:1px solid var(--line); border-radius:6px; padding:8px; background:var(--panel);
}
.pool-list.drag-over{outline:2px dashed var(--red); outline-offset:-6px}
.pool-empty{margin:14px 6px; font-size:13px; color:var(--sub); text-align:center}
.media-item{
  display:flex; align-items:center; gap:10px; padding:6px; border-radius:5px; cursor:grab;
  border:1px solid transparent;
}
.media-item:hover{background:var(--bg); border-color:var(--line)}
.media-thumb{
  flex:none; width:40px; height:56px; object-fit:contain; background:#fff;
  border:1px solid var(--line); border-radius:3px;
}
.media-thumb:not([src]){visibility:hidden}
.media-info{min-width:0; flex:1}
.media-name{
  margin:0; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.media-meta{margin:2px 0 0; font-size:12px; color:var(--sub)}

/* ---------- 編集領域 ---------- */
.editor{display:flex; flex-direction:column; gap:12px; min-width:0}
.editor-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.editor-toolbar .hint{flex:1; margin:0; font-size:13px; color:var(--sub)}

.deck-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:16px 18px;
  align-content:start; min-height:240px; padding:4px;
}
.deck-empty{
  grid-column:1/-1; text-align:center; color:var(--sub); border:2px dashed var(--line);
  border-radius:8px; padding:48px 20px;
}
.deck-empty strong{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}
.deck-empty p{margin:0; font-size:13px}
.deck-empty.drop-target{border-color:var(--red); color:var(--red)}
.deck-empty.drop-target strong{color:var(--red)}

.page-card{position:relative}
.page-thumb-wrap{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff; cursor:grab;
}
.page-thumb-wrap img{display:block; width:100%; aspect-ratio:0.72; object-fit:contain; background:#f4f4f4}
.page-num{
  position:absolute; left:6px; bottom:6px; background:rgba(20,20,20,.6); color:#fff;
  font-size:11px; font-variant-numeric:tabular-nums; padding:1px 7px; border-radius:9px; pointer-events:none;
}
.page-delete{
  position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%;
  background:rgba(20,20,20,.6); color:#fff; border:none; font-size:14px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
}
.page-delete:hover{background:var(--red)}
.page-card.insert-before::before,
.page-card.insert-after::after{
  content:""; position:absolute; top:0; bottom:0; width:4px; background:var(--red); border-radius:2px; z-index:2;
}
.page-card.insert-before::before{left:-10px}
.page-card.insert-after::after{right:-10px}

button,.btn{
  font:inherit; font-size:14px; border-radius:5px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:7px 12px; line-height:1.3;
}
button:hover{border-color:var(--sub)}
button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
button:disabled{opacity:.45; cursor:not-allowed}
.primary{background:var(--blue); color:var(--blue-ink); border-color:var(--blue); font-weight:700}
.primary:hover{filter:brightness(1.08); border-color:var(--blue)}
.ghost-btn{background:transparent}

.export-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.seg{display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.seg button{border:0; border-radius:0; padding:7px 16px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--red); color:#fff; font-weight:700}

.progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:2px; display:none}
.progress > i{display:block; height:100%; width:0; background:var(--red); transition:width .15s ease}
#status{font-size:13px; color:var(--sub); margin:0; min-height:1.4em}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <h1><span class="mark" aria-hidden="true"></span>PDF分割・結合ツール</h1>
  <p>PDFをページ単位に分解して並べ替え、PDF・PNG・JPGとして書き出します。ファイルはサーバーに送信されず、処理はすべてお使いの端末のブラウザ内で行われます。</p>
</header>

<main>
  <section class="pool box" id="mediaPool">
    <div class="pool-header">
      <h2>メディアプール</h2>
    </div>
    <div class="pool-actions">
      <button id="pickFilesBtn">ファイルを選択</button>
      <button id="pickFolderBtn">フォルダを選択</button>
    </div>
    <div class="pool-list" id="mediaList"></div>
    <input type="file" id="pickFiles" accept="application/pdf,.pdf" multiple class="sr">
    <input type="file" id="pickFolder" webkitdirectory multiple class="sr">
  </section>

  <section class="editor">
    <div class="editor-toolbar box">
      <h2>編集領域</h2>
      <p class="hint" id="deckCount"></p>
      <button id="clearDeck" class="ghost-btn" disabled>編集領域を空にする</button>
    </div>

    <div class="box">
      <div class="deck-grid" id="deckGrid"></div>
    </div>

    <div class="box" style="display:flex; flex-direction:column; gap:10px">
      <div class="export-bar">
        <span style="font-size:13.5px; color:var(--sub)">書き出し形式</span>
        <div class="seg" id="format" role="group" aria-label="書き出し形式">
          <button data-f="pdf" aria-pressed="true">PDF</button>
          <button data-f="png" aria-pressed="false">PNG</button>
          <button data-f="jpg" aria-pressed="false">JPG</button>
        </div>
        <button class="primary" id="exportBtn" disabled style="margin-left:auto">書き出す</button>
      </div>
      <div class="progress" id="prog"><i></i></div>
      <p id="status">メディアプールのファイルを編集領域へドラッグすると、ページごとに並びます。</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const PDFJS_CMAP_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
  const PDFJS_FONTS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';

  const THUMB_WIDTH = 260;   // 画面表示用サムネイルの描画幅(px)。CSS側は幅可変だが解像度はこれで固定
  const EXPORT_SCALE = 2;    // 画像書き出し時のPDF基準スケール(72dpi×2 ≒ 144dpi相当)

  const mediaListEl = $('mediaList'), mediaPoolEl = $('mediaPool');
  const deckGrid = $('deckGrid'), deckCountEl = $('deckCount'), clearDeckBtn = $('clearDeck');
  const exportBtn = $('exportBtn'), progEl = $('prog'), statusEl = $('status');

  /** @type {{id:string,name:string,arrayBuffer:ArrayBuffer,pdfjsDoc:any,pageCount:number}[]} */
  const mediaItems = [];
  /** @type {{id:string,mediaId:string,pageIndex:number}[]} 編集領域に並んでいるページの並び順そのもの */
  const deck = [];
  /** サムネイルのdataURLキャッシュ。キーは `${mediaId}:${pageIndex}` */
  const thumbCache = new Map();

  const mediaById = id => mediaItems.find(m => m.id === id);
  const setStatus = msg => { statusEl.textContent = msg; };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));

  function downloadBlob(blob, filename){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  // ---------- サムネイル描画 ----------
  async function ensureThumb(mediaId, pageIndex){
    const key = mediaId + ':' + pageIndex;
    if (thumbCache.has(key)) return thumbCache.get(key);
    const media = mediaById(mediaId);
    if (!media) return null;
    const page = await media.pdfjsDoc.getPage(pageIndex + 1); // pdf.jsは1始まり
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = THUMB_WIDTH / baseViewport.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.ceil(viewport.width));
    canvas.height = Math.max(1, Math.ceil(viewport.height));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    thumbCache.set(key, dataUrl);
    return dataUrl;
  }

  // ---------- メディアプール: 読み込み ----------
  async function addFilesToPool(fileList){
    const pdfFiles = fileList.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
    if (!pdfFiles.length){
      setStatus('PDFファイルが見つかりませんでした。');
      return;
    }
    setStatus(`${pdfFiles.length}件のPDFを読み込み中…`);
    let okCount = 0;
    for (const file of pdfFiles){
      try{
        const buf = await file.arrayBuffer();
        // pdf.js に渡す側だけコピーする。buf(元の ArrayBuffer)は pdf-lib での書き出し用に detach させず残す
        const doc = await pdfjsLib.getDocument({
          data: buf.slice(0),
          cMapUrl: PDFJS_CMAP_URL,
          cMapPacked: true,
          standardFontDataUrl: PDFJS_FONTS_URL,
        }).promise;
        const mediaItem = { id: uid(), name: file.name, arrayBuffer: buf, pdfjsDoc: doc, pageCount: doc.numPages };
        mediaItems.push(mediaItem);
        okCount++;
        renderMediaPool();
        ensureThumb(mediaItem.id, 0).then(() => renderMediaPool());
      }catch(err){
        console.error('PDF読み込み失敗:', file.name, err);
        setStatus(`"${file.name}" を開けませんでした(パスワード保護、または壊れたPDFの可能性があります)。`);
      }
    }
    if (okCount) setStatus(`${okCount}件のPDFを読み込みました。ドラッグして編集領域へ追加できます。`);
  }

  function buildMediaEmptyState(){
    const p = document.createElement('p');
    p.className = 'pool-empty';
    p.textContent = 'PDFファイルをドラッグ&ドロップ、または上のボタンから追加してください。';
    return p;
  }

  function renderMediaPool(){
    mediaListEl.innerHTML = '';
    if (!mediaItems.length){
      mediaListEl.appendChild(buildMediaEmptyState());
      return;
    }
    for (const media of mediaItems){
      const el = document.createElement('div');
      el.className = 'media-item';
      el.draggable = true;
      el.dataset.mediaId = media.id;
      el.title = 'ドラッグして編集領域へ追加';

      const thumb = document.createElement('img');
      thumb.className = 'media-thumb';
      thumb.alt = '';
      const cached = thumbCache.get(media.id + ':0');
      if (cached) thumb.src = cached;
      el.appendChild(thumb);

      const info = document.createElement('div');
      info.className = 'media-info';
      const name = document.createElement('p');
      name.className = 'media-name';
      name.textContent = media.name;
      const meta = document.createElement('p');
      meta.className = 'media-meta';
      meta.textContent = `PDF・${media.pageCount}ページ`;
      info.append(name, meta);
      el.appendChild(info);

      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/x-media-id', media.id);
        e.dataTransfer.effectAllowed = 'copy';
      });

      mediaListEl.appendChild(el);
    }
  }

  // ファイル/フォルダ選択ボタン
  $('pickFilesBtn').addEventListener('click', () => $('pickFiles').click());
  $('pickFolderBtn').addEventListener('click', () => $('pickFolder').click());
  $('pickFiles').addEventListener('change', e => { addFilesToPool(Array.from(e.target.files)); e.target.value = ''; });
  $('pickFolder').addEventListener('change', e => { addFilesToPool(Array.from(e.target.files)); e.target.value = ''; });

  // OSからのドラッグ&ドロップ(ファイル・フォルダとも)
  function readEntryFilesRecursive(entry){
    return new Promise(resolve => {
      if (entry.isFile){
        entry.file(file => resolve([file]), () => resolve([]));
      } else if (entry.isDirectory){
        const reader = entry.createReader();
        const all = [];
        const readBatch = () => {
          reader.readEntries(async entries => {
            if (!entries.length){ resolve(all); return; }
            for (const e of entries) all.push(...await readEntryFilesRecursive(e));
            readBatch(); // ディレクトリの内容は複数回に分けて返ってくることがあるため空になるまで読み続ける
          }, () => resolve(all));
        };
        readBatch();
      } else {
        resolve([]);
      }
    });
  }
  async function filesFromDataTransfer(dataTransfer){
    const items = dataTransfer.items;
    if (items && items.length && items[0].webkitGetAsEntry){
      const files = [];
      const entries = [];
      for (const item of items){
        if (item.kind !== 'file') continue;
        const entry = item.webkitGetAsEntry();
        if (entry) entries.push(entry); else { const f = item.getAsFile(); if (f) files.push(f); }
      }
      for (const entry of entries) files.push(...await readEntryFilesRecursive(entry));
      return files;
    }
    return Array.from(dataTransfer.files || []);
  }
  ['dragenter','dragover'].forEach(ev => mediaPoolEl.addEventListener(ev, e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    mediaListEl.classList.add('drag-over');
  }));
  ['dragleave','drop'].forEach(ev => mediaPoolEl.addEventListener(ev, e => {
    if (ev === 'dragleave' && mediaPoolEl.contains(e.relatedTarget)) return;
    mediaListEl.classList.remove('drag-over');
  }));
  mediaPoolEl.addEventListener('drop', async e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    const files = await filesFromDataTransfer(e.dataTransfer);
    addFilesToPool(files);
  });

  // ---------- 編集領域: 描画 ----------
  function updateExportEnabled(){
    exportBtn.disabled = deck.length === 0;
    clearDeckBtn.disabled = deck.length === 0;
  }

  function renderDeck(){
    deckGrid.innerHTML = '';
    if (!deck.length){
      const empty = document.createElement('div');
      empty.className = 'deck-empty';
      empty.innerHTML = '<strong>ここにPDFをドラッグ</strong><p>メディアプールのファイルをこの枠にドロップすると、ページごとに並びます</p>';
      deckGrid.appendChild(empty);
    } else {
      deck.forEach((entry, i) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.draggable = true;
        card.dataset.deckId = entry.id;

        const wrap = document.createElement('div');
        wrap.className = 'page-thumb-wrap';
        const img = document.createElement('img');
        img.alt = `ページ ${i + 1}`;
        wrap.appendChild(img);
        card.appendChild(wrap);

        const num = document.createElement('span');
        num.className = 'page-num';
        num.textContent = String(i + 1);
        card.appendChild(num);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'page-delete';
        del.setAttribute('aria-label', `${i + 1}ページ目を削除`);
        del.textContent = '×';
        del.addEventListener('click', e => { e.stopPropagation(); deleteDeckEntry(entry.id); });
        card.appendChild(del);

        card.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/x-deck-id', entry.id);
          e.dataTransfer.effectAllowed = 'move';
        });

        deckGrid.appendChild(card);

        const cached = thumbCache.get(entry.mediaId + ':' + entry.pageIndex);
        if (cached) img.src = cached;
        else ensureThumb(entry.mediaId, entry.pageIndex).then(url => { if (url) img.src = url; });
      });
    }
    deckCountEl.textContent = deck.length ? `${deck.length}ページ` : '';
    updateExportEnabled();
  }

  function insertMediaAsPages(mediaId, atIndex){
    const media = mediaById(mediaId);
    if (!media) return;
    const newEntries = [];
    for (let i = 0; i < media.pageCount; i++) newEntries.push({ id: uid(), mediaId, pageIndex: i });
    deck.splice(atIndex, 0, ...newEntries);
    renderDeck();
  }
  function moveDeckEntry(deckId, atIndex){
    const fromIndex = deck.findIndex(d => d.id === deckId);
    if (fromIndex === -1) return;
    const [item] = deck.splice(fromIndex, 1);
    const insertAt = fromIndex < atIndex ? atIndex - 1 : atIndex;
    deck.splice(insertAt, 0, item);
    renderDeck();
  }
  function deleteDeckEntry(deckId){
    const idx = deck.findIndex(d => d.id === deckId);
    if (idx === -1) return;
    deck.splice(idx, 1);
    renderDeck();
  }

  clearDeckBtn.addEventListener('click', () => {
    if (!deck.length) return;
    if (confirm('編集領域のページをすべて削除しますか?(メディアプールのファイルは残ります)')){
      deck.length = 0;
      renderDeck();
    }
  });

  // ---------- 編集領域: ドラッグ&ドロップでの挿入位置判定 ----------
  // グリッドは折り返しがあるため、まず行(top座標が近いもの同士)にまとめ、
  // ポインタに最も近い行を選んでから、その行内でポインタの左右どちらに挿入するかを決める。
  function computeInsertIndex(container, clientX, clientY){
    const cards = [...container.querySelectorAll('.page-card')];
    if (!cards.length) return 0;
    const rects = cards.map(c => c.getBoundingClientRect());
    const rows = [];
    rects.forEach((r, i) => {
      let row = rows.find(row => Math.abs(row.top - r.top) < 4);
      if (!row){ row = { top: r.top, bottom: r.bottom, items: [] }; rows.push(row); }
      row.items.push({ index: i, rect: r });
      row.bottom = Math.max(row.bottom, r.bottom);
    });
    rows.sort((a, b) => a.top - b.top);
    rows.forEach(row => row.items.sort((a, b) => a.rect.left - b.rect.left));

    let targetRow = rows.find(row => clientY >= row.top && clientY <= row.bottom);
    if (!targetRow) targetRow = clientY < rows[0].top ? rows[0] : rows[rows.length - 1];

    for (const item of targetRow.items){
      const midX = item.rect.left + item.rect.width / 2;
      if (clientX < midX) return item.index;
    }
    return targetRow.items[targetRow.items.length - 1].index + 1;
  }

  function clearInsertHighlights(){
    deckGrid.querySelectorAll('.insert-before,.insert-after').forEach(el => el.classList.remove('insert-before', 'insert-after'));
    const empty = deckGrid.querySelector('.deck-empty');
    if (empty) empty.classList.remove('drop-target');
  }

  deckGrid.addEventListener('dragover', e => {
    const isMedia = e.dataTransfer.types.includes('text/x-media-id');
    const isDeck = e.dataTransfer.types.includes('text/x-deck-id');
    if (!isMedia && !isDeck) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = isDeck ? 'move' : 'copy';
    clearInsertHighlights();
    if (!deck.length){
      deckGrid.querySelector('.deck-empty')?.classList.add('drop-target');
      return;
    }
    const idx = computeInsertIndex(deckGrid, e.clientX, e.clientY);
    const cards = [...deckGrid.querySelectorAll('.page-card')];
    if (idx >= cards.length) cards[cards.length - 1].classList.add('insert-after');
    else cards[idx].classList.add('insert-before');
  });
  deckGrid.addEventListener('dragleave', e => {
    if (!deckGrid.contains(e.relatedTarget)) clearInsertHighlights();
  });
  deckGrid.addEventListener('drop', e => {
    const isMedia = e.dataTransfer.types.includes('text/x-media-id');
    const isDeck = e.dataTransfer.types.includes('text/x-deck-id');
    if (!isMedia && !isDeck) return;
    e.preventDefault();
    clearInsertHighlights();
    const idx = deck.length ? computeInsertIndex(deckGrid, e.clientX, e.clientY) : 0;
    if (isMedia) insertMediaAsPages(e.dataTransfer.getData('text/x-media-id'), idx);
    else moveDeckEntry(e.dataTransfer.getData('text/x-deck-id'), idx);
  });

  // ---------- 書き出し形式の切り替え ----------
  let exportFormat = 'pdf';
  document.querySelectorAll('#format button').forEach(b => b.addEventListener('click', () => {
    exportFormat = b.dataset.f;
    document.querySelectorAll('#format button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  }));

  function singleSourceName(){
    const ids = new Set(deck.map(d => d.mediaId));
    if (ids.size !== 1) return null;
    const media = mediaById([...ids][0]);
    return media ? media.name.replace(/\.pdf$/i, '') + '_edited.pdf' : null;
  }

  async function exportPdf(){
    setStatus('PDFを作成しています…');
    const outDoc = await PDFLib.PDFDocument.create();
    const libDocCache = new Map();
    for (let i = 0; i < deck.length; i++){
      const entry = deck[i];
      let libDoc = libDocCache.get(entry.mediaId);
      if (!libDoc){
        const media = mediaById(entry.mediaId);
        libDoc = await PDFLib.PDFDocument.load(media.arrayBuffer);
        libDocCache.set(entry.mediaId, libDoc);
      }
      const [copied] = await outDoc.copyPages(libDoc, [entry.pageIndex]);
      outDoc.addPage(copied);
      progEl.firstElementChild.style.width = `${Math.round(((i + 1) / deck.length) * 100)}%`;
    }
    const bytes = await outDoc.save();
    downloadBlob(new Blob([bytes], { type: 'application/pdf' }), singleSourceName() || 'merged.pdf');
    setStatus(`書き出しが完了しました(${deck.length}ページのPDF)。`);
  }

  async function exportImages(format){
    const zip = new JSZip();
    const ext = format === 'png' ? 'png' : 'jpg';
    const mime = format === 'png' ? 'image/png' : 'image/jpeg';
    for (let i = 0; i < deck.length; i++){
      const entry = deck[i];
      const media = mediaById(entry.mediaId);
      const page = await media.pdfjsDoc.getPage(entry.pageIndex + 1);
      const viewport = page.getViewport({ scale: EXPORT_SCALE });
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      const ctx = canvas.getContext('2d');
      if (format === 'jpg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      await page.render({ canvasContext: ctx, viewport }).promise;
      const blob = await new Promise(res => canvas.toBlob(res, mime, format === 'jpg' ? 0.92 : undefined));
      zip.file(`page-${String(i + 1).padStart(3, '0')}.${ext}`, blob);
      setStatus(`書き出し中… ${i + 1}/${deck.length}`);
      progEl.firstElementChild.style.width = `${Math.round(((i + 1) / deck.length) * 100)}%`;
    }
    setStatus('ZIPファイルを作成しています…');
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(zipBlob, `pages_${format}.zip`);
    setStatus(`書き出しが完了しました(${deck.length}枚の${format.toUpperCase()}画像をZIPにまとめました)。`);
  }

  exportBtn.addEventListener('click', async () => {
    if (!deck.length) return;
    exportBtn.disabled = true;
    progEl.style.display = 'block';
    progEl.firstElementChild.style.width = '0%';
    try{
      if (exportFormat === 'pdf') await exportPdf();
      else await exportImages(exportFormat);
    }catch(err){
      console.error(err);
      setStatus('書き出し中にエラーが発生しました。');
    }finally{
      progEl.style.display = 'none';
      updateExportEnabled();
    }
  });

  renderMediaPool();
  renderDeck();
})();
</script>
</body>
</html>
