<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簡易2D CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1B2733; --sub:#5A6878; --line:#CBD4DE;
  --red:#E0301E; --blue:#2B5C8A; --blue-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
    --red:#FF5040; --blue:#5B93C9; --blue-ink:#0E1620;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
  --red:#FF5040; --blue:#5B93C9; --blue-ink:#0E1620;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%; overscroll-behavior:none}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:14.5px; line-height:1.5;
  display:flex; flex-direction:column; height:100vh;
  overflow:hidden;
}
header{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; flex:none;
  padding:12px 18px 6px;
}
.back-link{
  flex:none; display:inline-flex; align-items:center; gap:4px;
  font-size:12.5px; color:var(--sub); text-decoration:none;
  padding:4px 9px; border-radius:5px; border:1px solid var(--line);
  order:-1;
}
.back-link:hover{border-color:var(--blue); color:var(--ink)}
h1{
  margin:0; font-size:19px; font-weight:700; letter-spacing:.02em;
  display:flex; align-items:center; gap:8px;
}
h1 .mark{
  width:18px; height:14px; border:2.5px solid var(--red); position:relative; display:inline-block; flex:none;
}
h1 .mark::after{
  content:""; position:absolute; right:-10px; top:-8px; width:10px; height:8px;
  border:2px solid var(--red); background:var(--bg);
}
header p{margin:0; color:var(--sub); font-size:12.5px}

main{
  display:grid; grid-template-columns:200px minmax(0,1fr) 240px; gap:1px;
  background:var(--line); flex:1; min-height:0; overflow:hidden;
}
.panel{background:var(--panel); min-height:0; display:flex; flex-direction:column}
.panel-pad{padding:12px; display:flex; flex-direction:column; gap:10px; overflow:auto; overscroll-behavior:contain}

/* 狭い画面(スマホ)では3カラムを縦積みにし、上=ツールバー/中央=キャンバス/下=インスペクタにする */
@media (max-width: 760px){
  main{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,32vh) minmax(240px,1fr) minmax(0,28vh);
  }
}

.tool-group{display:flex; flex-direction:column; gap:4px}
.tool-group-label{font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.03em; margin:4px 0 0}
.tool-btn{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  font:inherit; font-size:13.5px; padding:8px 10px; border-radius:6px;
  border:1px solid transparent; background:transparent; color:var(--ink); cursor:pointer;
}
.tool-btn .ico{flex:none; width:18px; text-align:center}
.tool-btn:hover{background:var(--bg)}
.tool-btn[aria-pressed="true"]{background:var(--blue); color:var(--blue-ink); font-weight:700}
.tool-btn:disabled{opacity:.38; cursor:not-allowed}
.tool-btn:disabled:hover{background:transparent}
.field{display:flex; flex-direction:column; gap:3px}
.field label{font-size:11.5px; color:var(--sub)}
.field input[type="number"]{
  font:inherit; font-size:13.5px; padding:6px 8px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); width:100%;
}
.check-row{display:flex; align-items:center; gap:7px; font-size:13px}
.check-row input{width:15px; height:15px}
hr.sep{border:0; border-top:1px solid var(--line); margin:4px 0}

.canvas-wrap{position:relative; overflow:hidden; background:var(--bg); cursor:default; flex:1; min-height:0; overscroll-behavior:none; touch-action:none}
.canvas-wrap.pan-mode{cursor:grab}
.canvas-wrap.panning{cursor:grabbing}
.canvas-wrap.draw-mode{cursor:crosshair}
svg.stage{display:block; width:100%; height:100%; touch-action:none}
.zoom-controls{
  position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:4px; z-index:2;
}
.zoom-controls button{
  width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--panel);
  color:var(--ink); font-size:16px; cursor:pointer; line-height:1;
}
.zoom-controls button:hover{border-color:var(--blue)}
.hint-banner{
  position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:2;
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 12px;
  font-size:12.5px; color:var(--sub); white-space:nowrap; pointer-events:none; display:none;
}

.inspector-empty{color:var(--sub); font-size:13px; padding:4px 2px}
.inspector-title{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px}
.constraint-badge{
  font-size:12px; color:var(--sub); background:var(--bg); border:1px solid var(--line);
  border-radius:5px; padding:6px 8px; line-height:1.5;
  display:flex; justify-content:space-between; align-items:center; gap:6px;
}
.readout{font-size:12px; color:var(--sub)}
.readout b{color:var(--ink); font-variant-numeric:tabular-nums}

button.danger{
  font:inherit; font-size:13px; padding:7px 10px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); color:var(--red); cursor:pointer;
}
button.danger:hover{border-color:var(--red); background:color-mix(in srgb, var(--red) 8%, transparent)}
button.ghost-sm{
  font:inherit; font-size:12.5px; padding:5px 8px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); cursor:pointer; flex:none;
}
button.ghost-sm:hover{border-color:var(--blue)}

#status{
  flex:none; padding:6px 14px; font-size:12.5px; color:var(--sub); min-height:1.6em;
  background:var(--panel); border-top:1px solid var(--line);
}
#status.error{color:var(--red)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <a class="back-link" href="../" aria-label="ツール一覧に戻る">← 一覧</a>
  <h1><span class="mark" aria-hidden="true"></span>簡易2D CAD</h1>
  <p>点・線分・円を配置し、幾何拘束で正確に組み立てるツールです。データは端末内で完結し、どこにも送信されません。</p>
</header>

<main>
  <section class="panel">
    <div class="panel-pad">
      <div class="tool-group">
        <p class="tool-group-label">描画</p>
        <button type="button" class="tool-btn" id="toolSelect" aria-pressed="true"><span class="ico">⇖</span>選択・移動</button>
        <button type="button" class="tool-btn" id="toolPoint" aria-pressed="false"><span class="ico">・</span>点</button>
        <button type="button" class="tool-btn" id="toolLine" aria-pressed="false"><span class="ico">╱</span>線分</button>
        <button type="button" class="tool-btn" id="toolCircle" aria-pressed="false"><span class="ico">◯</span>円</button>
      </div>
      <hr class="sep">
      <div class="tool-group">
        <p class="tool-group-label" id="selectionCountLabel">拘束(0個選択中)</p>
        <button type="button" class="tool-btn" id="cmdCoincident" title="2点を一致させる"><span class="ico">・</span>一致</button>
        <button type="button" class="tool-btn" id="cmdDistance" title="2点間、または点と線分の距離を指定値にする"><span class="ico">↔</span>距離</button>
        <button type="button" class="tool-btn" id="cmdHorizontal" title="線分、または2点を水平にする"><span class="ico">—</span>水平</button>
        <button type="button" class="tool-btn" id="cmdVertical" title="線分、または2点を鉛直にする"><span class="ico">|</span>鉛直</button>
        <button type="button" class="tool-btn" id="cmdParallel" title="2本の線分を平行にする"><span class="ico">∥</span>平行</button>
        <button type="button" class="tool-btn" id="cmdPerpendicular" title="2本の線分を直交させる"><span class="ico">⊥</span>垂直</button>
        <button type="button" class="tool-btn" id="cmdEqual" title="2本の線分の長さ、または2つの円の直径を揃える"><span class="ico">=</span>等しい</button>
        <button type="button" class="tool-btn" id="cmdTangent" title="円と円、または円と線分を接させる"><span class="ico">⊙</span>接する</button>
        <button type="button" class="tool-btn" id="cmdDiameter" title="円の直径を指定値にする"><span class="ico">⌀</span>直径</button>
        <div class="field">
          <label for="constraintValue">値(mm、距離・直径で使用)</label>
          <input type="number" id="constraintValue" value="20" min="0.01" step="0.5">
        </div>
        <button type="button" class="tool-btn" id="cmdFixed" title="選択した図形の基準点のドラッグ移動を禁止/許可する"><span class="ico">📌</span>固定</button>
        <button type="button" class="tool-btn" id="cmdConstruction" title="選択した線分・円を構築線に切り替える"><span class="ico">┄</span>構築線</button>
        <button type="button" class="tool-btn" id="cmdDelete" title="選択した図形を削除する"><span class="ico">×</span>削除</button>
      </div>
      <hr class="sep">
      <div class="tool-group">
        <p class="tool-group-label">表示</p>
        <label class="check-row"><input type="checkbox" id="showDims" checked>直径を表示</label>
        <label class="check-row"><input type="checkbox" id="showGrid" checked>グリッドを表示</label>
      </div>
      <hr class="sep">
      <button type="button" class="ghost-sm" id="fitViewBtn">全体表示</button>
      <button type="button" class="danger" id="clearAllBtn">すべて消去</button>
    </div>
  </section>

  <section class="panel">
    <div class="canvas-wrap" id="canvasWrap">
      <svg class="stage" id="stage"></svg>
      <p class="hint-banner" id="hintBanner"></p>
      <div class="zoom-controls">
        <button type="button" id="zoomInBtn" aria-label="拡大">+</button>
        <button type="button" id="zoomOutBtn" aria-label="縮小">−</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-pad" id="inspector">
      <p class="inspector-empty">図形をクリックすると詳細がここに表示されます。</p>
    </div>
  </section>
</main>

<p id="status">計算エンジンを読み込み中…</p>

<script src="slvs.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- データモデル(汎用: 点・線分・円) ----------
  // entity:
  //   {id, type:'point', x, y(mm, Y上向き), fixed}
  //   {id, type:'line', p1:pointId, p2:pointId, construction}
  //   {id, type:'circle', center:pointId, r(mm), construction}
  // constraint:
  //   {id, type:'coincident'|'distance'|'horizontal'|'vertical'|'parallel'|'perpendicular'|'equal'|'tangent'|'diameter',
  //    refs:[entityId,...], value?}
  const entities = [];
  const constraints = [];
  let nextEntityId = 1;
  let nextConstraintId = 1;
  let selectedIds = []; // 選択順を保持(複数選択時はShift+クリック)
  // pendingCommand: コマンドを「選択より先に」実行した場合の、対象ピック待ち状態。
  // {type, value?}。null以外の間はキャンバスのクリックが選択(のトグル追加)として働き、
  // 選択内容がそのコマンドの条件を満たした瞬間に自動的に実行される。
  let pendingCommand = null;

  const CONSTRAINT_LABELS = {
    coincident: '一致', distance: '距離', horizontal: '水平', vertical: '鉛直',
    parallel: '平行', perpendicular: '垂直', equal: '等しい', tangent: '接する', diameter: '直径',
    fixed: '固定', construction: '構築線', delete: '削除',
  };

  const statusEl = $('status');
  const setStatus = (msg, isError = false) => {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  };

  const entityById = id => entities.find(e => e.id === id);
  const constraintsFor = id => constraints.filter(c => c.refs.includes(id));

  // ---------- 幾何計算: SolveSpace本家の拘束ソルバー(libslvs、WebAssembly版)を使用 ----------
  // https://github.com/solvespace/solvespace (npm: slvs, GPL-3.0)。
  // 1つの持続的なスケッチとして扱い、再計算のたびに「このツールのentities/constraints」から
  // slvs側のスケッチを丸ごと再構築して1回solveする(差分更新はしない。この規模なら十分高速)。
  //
  // 既知の制約(実機検証済み):
  // - addCircleの法線には3D法線が必要(addNormal2D/addBase2D由来の法線では不可)。
  // - slvsのtangent()ヘルパーは円弧(Arc)専用で、完全な円(Circle)には使えない。
  //   円↔円は「中心間距離 = 半径の和」、円↔線分は「中心から線分までの距離 = 半径」という
  //   distance系拘束で数学的に同値な表現にしている。
  let slvs = null;
  const slvsReadyPromise = (typeof solvespace === 'function')
    ? solvespace().then(m => { slvs = m; })
    : Promise.reject(new Error('slvs.js が読み込まれていません'));

  function ptLineDistance(g, wp, ptH, lineH, value){
    return slvs.addConstraint(g, slvs.C_PT_LINE_DISTANCE, wp, value, ptH, slvs.E_NONE, lineH, slvs.E_NONE, slvs.E_NONE, slvs.E_NONE, false, false);
  }

  function applyConstraint(g, wp, c, H){
    const { ptHandle, lineHandle, circleHandle } = H;
    const refs = c.refs.map(entityById);
    switch (c.type){
      case 'coincident': {
        slvs.coincident(g, ptHandle.get(refs[0].id), ptHandle.get(refs[1].id), wp);
        break;
      }
      case 'distance': {
        if (refs[0].type === 'point' && refs[1].type === 'point'){
          slvs.distance(g, ptHandle.get(refs[0].id), ptHandle.get(refs[1].id), c.value, wp);
        } else {
          const ptEnt = refs[0].type === 'point' ? refs[0] : refs[1];
          const lineEnt = refs[0].type === 'point' ? refs[1] : refs[0];
          ptLineDistance(g, wp, ptHandle.get(ptEnt.id), lineHandle.get(lineEnt.id), c.value);
        }
        break;
      }
      case 'horizontal': {
        if (refs.length === 1 && refs[0].type === 'line'){
          slvs.horizontal(g, lineHandle.get(refs[0].id), wp, slvs.E_NONE);
        } else {
          slvs.horizontal(g, ptHandle.get(refs[0].id), wp, ptHandle.get(refs[1].id));
        }
        break;
      }
      case 'vertical': {
        if (refs.length === 1 && refs[0].type === 'line'){
          slvs.vertical(g, lineHandle.get(refs[0].id), wp, slvs.E_NONE);
        } else {
          slvs.vertical(g, ptHandle.get(refs[0].id), wp, ptHandle.get(refs[1].id));
        }
        break;
      }
      case 'parallel': {
        slvs.parallel(g, lineHandle.get(refs[0].id), lineHandle.get(refs[1].id), wp);
        break;
      }
      case 'perpendicular': {
        slvs.perpendicular(g, lineHandle.get(refs[0].id), lineHandle.get(refs[1].id), wp, false);
        break;
      }
      case 'equal': {
        if (refs[0].type === 'circle' && refs[1].type === 'circle'){
          slvs.addConstraint(g, slvs.C_EQUAL_RADIUS, wp, 0, slvs.E_NONE, slvs.E_NONE, circleHandle.get(refs[0].id), circleHandle.get(refs[1].id), slvs.E_NONE, slvs.E_NONE, false, false);
        } else {
          slvs.equal(g, lineHandle.get(refs[0].id), lineHandle.get(refs[1].id), wp);
        }
        break;
      }
      case 'tangent': {
        if (refs[0].type === 'circle' && refs[1].type === 'circle'){
          const pa = ptHandle.get(refs[0].center), pb = ptHandle.get(refs[1].center);
          slvs.distance(g, pa, pb, refs[0].r + refs[1].r, wp);
        } else {
          const circleEnt = refs[0].type === 'circle' ? refs[0] : refs[1];
          const lineEnt = refs[0].type === 'circle' ? refs[1] : refs[0];
          ptLineDistance(g, wp, ptHandle.get(circleEnt.center), lineHandle.get(lineEnt.id), circleEnt.r);
        }
        break;
      }
      case 'diameter': {
        slvs.diameter(g, circleHandle.get(refs[0].id), c.value);
        break;
      }
    }
  }

  // entities/constraints からslvsのスケッチを毎回再構築して解く。
  // draggingId が指定されたら、その点だけ一時的に dragged() にして「マウス位置に近い解」へ収束させる。
  function solveAll(draggingId){
    if (!slvs) return true;
    slvs.clearSketch();
    const g = 1;
    const normal = slvs.addNormal3D(g, 1, 0, 0, 0);
    const origin = slvs.addPoint3D(g, 0, 0, 0);
    const wp = slvs.addWorkplane(g, origin, normal);

    const ptHandle = new Map(), lineHandle = new Map(), circleHandle = new Map(), circleRadiusHandle = new Map();

    for (const e of entities){
      if (e.type !== 'point') continue;
      const h = slvs.addPoint2D(g, e.x, e.y, wp);
      ptHandle.set(e.id, h);
      if (e.fixed || e.id === draggingId) slvs.dragged(g, h, wp);
    }
    for (const e of entities){
      if (e.type === 'line'){
        const a = ptHandle.get(e.p1), b = ptHandle.get(e.p2);
        if (!a || !b) continue;
        lineHandle.set(e.id, slvs.addLine2D(g, a, b, wp));
      } else if (e.type === 'circle'){
        const c = ptHandle.get(e.center);
        if (!c) continue;
        const distH = slvs.addDistance(g, e.r, wp);
        circleRadiusHandle.set(e.id, distH);
        circleHandle.set(e.id, slvs.addCircle(g, normal, c, distH, wp));
      }
    }

    const H = { ptHandle, lineHandle, circleHandle };
    for (const c of constraints){
      try { applyConstraint(g, wp, c, H); }
      catch (err){ console.error('拘束の適用に失敗しました:', c, err); }
    }

    const result = slvs.solveSketch(g, true);
    if (result.result !== 0){
      setStatus('拘束を満たす解が見つかりませんでした。配置や値を見直してください(直前の状態を維持します)。', true);
      return false;
    }
    for (const e of entities){
      if (e.type === 'point'){
        const h = ptHandle.get(e.id);
        if (h){ e.x = slvs.getParamValue(h.param[0]); e.y = slvs.getParamValue(h.param[1]); }
      } else if (e.type === 'circle'){
        const dh = circleRadiusHandle.get(e.id);
        if (dh) e.r = slvs.getParamValue(dh.param[0]);
      }
    }
    return true;
  }

  // ---------- ビュー変換(mm ⇔ 画面px、Y上向き) ----------
  const stage = $('stage');
  const canvasWrap = $('canvasWrap');
  let scale = 4; // px/mm
  let panX = 0, panY = 0;
  function resetView(){
    const rect = canvasWrap.getBoundingClientRect();
    panX = rect.width / 2; panY = rect.height / 2; scale = 4;
  }
  function toScreen(mx, my){ return { x: panX + mx * scale, y: panY - my * scale }; }
  function toModel(sx, sy){ return { x: (sx - panX) / scale, y: -(sy - panY) / scale }; }
  function svgPointFromEvent(e){
    const rect = stage.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function fitView(){
    const rect = canvasWrap.getBoundingClientRect();
    const pts = entities.filter(e => e.type === 'point');
    if (!pts.length){ resetView(); render(); return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const e of entities){
      if (e.type === 'point'){
        minX = Math.min(minX, e.x); maxX = Math.max(maxX, e.x);
        minY = Math.min(minY, e.y); maxY = Math.max(maxY, e.y);
      } else if (e.type === 'circle'){
        const c = entityById(e.center);
        if (!c) continue;
        minX = Math.min(minX, c.x - e.r); maxX = Math.max(maxX, c.x + e.r);
        minY = Math.min(minY, c.y - e.r); maxY = Math.max(maxY, c.y + e.r);
      }
    }
    const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
    const pad = 1.2;
    scale = Math.min((rect.width / w) / pad, (rect.height / h) / pad);
    scale = Math.min(Math.max(scale, 0.2), 200);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    panX = rect.width / 2 - cx * scale;
    panY = rect.height / 2 + cy * scale;
    render();
  }

  // ---------- 描画 ----------
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function trimNum(n){ return Math.round(n * 1000) / 1000; }

  function render(){
    stage.innerHTML = '';
    const rect = canvasWrap.getBoundingClientRect();
    stage.setAttribute('width', rect.width);
    stage.setAttribute('height', rect.height);

    if ($('showGrid').checked) renderGrid(rect);

    for (const e of entities){
      if (e.type !== 'line') continue;
      const a = entityById(e.p1), b = entityById(e.p2);
      if (!a || !b) continue;
      const pa = toScreen(a.x, a.y), pb = toScreen(b.x, b.y);
      const isSel = selectedIds.includes(e.id);
      const isCons = constraintsFor(e.id).length > 0;
      stage.appendChild(el('line', {
        x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y,
        stroke: isSel ? 'var(--red)' : (isCons ? 'var(--blue)' : 'var(--ink)'),
        'stroke-width': isSel ? 2.5 : 1.6,
        'stroke-dasharray': e.construction ? '5,4' : 'none',
        'data-id': e.id,
      }));
    }
    for (const e of entities){
      if (e.type !== 'circle') continue;
      const c = entityById(e.center);
      if (!c) continue;
      const p = toScreen(c.x, c.y);
      const rpx = e.r * scale;
      const isSel = selectedIds.includes(e.id);
      const isCons = constraintsFor(e.id).length > 0;
      stage.appendChild(el('circle', {
        cx: p.x, cy: p.y, r: Math.max(0.5, rpx),
        fill: 'none',
        stroke: isSel ? 'var(--red)' : (isCons ? 'var(--blue)' : 'var(--ink)'),
        'stroke-width': isSel ? 2.5 : 1.6,
        'stroke-dasharray': e.construction ? '5,4' : 'none',
        'data-id': e.id,
      }));
      if ($('showDims').checked){
        const label = el('text', {
          x: p.x, y: p.y - rpx - 8,
          'text-anchor': 'middle', 'font-size': 11.5, fill: 'var(--sub)',
          'pointer-events': 'none', style: 'font-family:inherit',
        });
        label.textContent = `⌀${trimNum(e.r * 2)}`;
        stage.appendChild(label);
      }
    }
    for (const e of entities){
      if (e.type !== 'point') continue;
      const p = toScreen(e.x, e.y);
      const isSel = selectedIds.includes(e.id);
      stage.appendChild(el('circle', {
        cx: p.x, cy: p.y, r: isSel ? 4.5 : 3.2,
        fill: e.fixed ? 'var(--red)' : (isSel ? 'var(--red)' : 'var(--ink)'),
        'data-id': e.id,
      }));
    }
  }

  function renderGrid(rect){
    const stepMm = pickGridStep();
    const topLeft = toModel(0, 0), bottomRight = toModel(rect.width, rect.height);
    const minX = Math.floor(Math.min(topLeft.x, bottomRight.x) / stepMm) * stepMm;
    const maxX = Math.ceil(Math.max(topLeft.x, bottomRight.x) / stepMm) * stepMm;
    const minY = Math.floor(Math.min(topLeft.y, bottomRight.y) / stepMm) * stepMm;
    const maxY = Math.ceil(Math.max(topLeft.y, bottomRight.y) / stepMm) * stepMm;
    const g = el('g', {});
    for (let x = minX; x <= maxX; x += stepMm){
      const isAxis = Math.abs(x) < 1e-6;
      const p1 = toScreen(x, minY), p2 = toScreen(x, maxY);
      g.appendChild(el('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: isAxis ? 'var(--sub)' : 'var(--line)', 'stroke-width': isAxis ? 1.2 : 0.7 }));
    }
    for (let y = minY; y <= maxY; y += stepMm){
      const isAxis = Math.abs(y) < 1e-6;
      const p1 = toScreen(minX, y), p2 = toScreen(maxX, y);
      g.appendChild(el('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: isAxis ? 'var(--sub)' : 'var(--line)', 'stroke-width': isAxis ? 1.2 : 0.7 }));
    }
    stage.appendChild(g);
  }
  function pickGridStep(){
    const targetMm = 40 / scale;
    const pow = Math.pow(10, Math.floor(Math.log10(targetMm)));
    for (const m of [1, 2, 5, 10]){
      if (m * pow >= targetMm) return m * pow;
    }
    return 10 * pow;
  }

  // ---------- インスペクタ ----------
  const inspectorEl = $('inspector');
  const TYPE_LABEL = { point: '点', line: '線分', circle: '円' };

  function renderInspector(){
    if (!selectedIds.length){
      inspectorEl.innerHTML = '<p class="inspector-empty">図形をクリックすると詳細がここに表示されます(Shiftキーで複数選択できます)。</p>';
      return;
    }
    if (selectedIds.length > 1){
      inspectorEl.innerHTML = '';
      const title = document.createElement('p');
      title.className = 'inspector-title';
      title.textContent = `${selectedIds.length}個選択中`;
      inspectorEl.appendChild(title);
      const hint = document.createElement('p');
      hint.className = 'inspector-empty';
      hint.textContent = '左の「拘束」コマンドをクリックすると、この選択に適用されます。';
      inspectorEl.appendChild(hint);
      return;
    }

    const e = entityById(selectedIds[0]);
    if (!e){ inspectorEl.innerHTML = '<p class="inspector-empty">図形をクリックすると詳細がここに表示されます。</p>'; return; }
    inspectorEl.innerHTML = '';
    const title = document.createElement('p');
    title.className = 'inspector-title';
    title.textContent = `${TYPE_LABEL[e.type]} #${e.id}`;
    inspectorEl.appendChild(title);

    if (e.type === 'point'){
      const fx = document.createElement('div'); fx.className = 'field';
      fx.innerHTML = `<label for="inspX">X (mm)</label><input type="number" id="inspX" step="0.5">`;
      inspectorEl.appendChild(fx);
      const fy = document.createElement('div'); fy.className = 'field';
      fy.innerHTML = `<label for="inspY">Y (mm)</label><input type="number" id="inspY" step="0.5">`;
      inspectorEl.appendChild(fy);
      const xi = fx.querySelector('#inspX'), yi = fy.querySelector('#inspY');
      xi.value = trimNum(e.x); yi.value = trimNum(e.y);
      const applyXY = () => {
        const vx = parseFloat(xi.value), vy = parseFloat(yi.value);
        if (Number.isFinite(vx)) e.x = vx;
        if (Number.isFinite(vy)) e.y = vy;
        solveAll(e.id); render();
      };
      xi.addEventListener('input', applyXY);
      yi.addEventListener('input', applyXY);

      const fixedRow = document.createElement('label'); fixedRow.className = 'check-row';
      fixedRow.innerHTML = `<input type="checkbox" id="inspFixed">固定する(ドラッグ移動を禁止)`;
      inspectorEl.appendChild(fixedRow);
      const fChk = fixedRow.querySelector('#inspFixed');
      fChk.checked = !!e.fixed;
      fChk.addEventListener('change', () => { e.fixed = fChk.checked; solveAll(); render(); });
    } else if (e.type === 'line'){
      const a = entityById(e.p1), b = entityById(e.p2);
      const len = (a && b) ? Math.hypot(b.x - a.x, b.y - a.y) : 0;
      const readout = document.createElement('p'); readout.className = 'readout';
      readout.innerHTML = `長さ: <b>${trimNum(len)}</b> mm`;
      inspectorEl.appendChild(readout);
      const cRow = document.createElement('label'); cRow.className = 'check-row';
      cRow.innerHTML = `<input type="checkbox" id="inspConstruction">構築線にする`;
      inspectorEl.appendChild(cRow);
      const cChk = cRow.querySelector('#inspConstruction');
      cChk.checked = e.construction;
      cChk.addEventListener('change', () => { e.construction = cChk.checked; render(); });
    } else if (e.type === 'circle'){
      const fd = document.createElement('div'); fd.className = 'field';
      fd.innerHTML = `<label for="inspD">直径 (mm)</label><input type="number" id="inspD" min="0.1" step="0.5">`;
      inspectorEl.appendChild(fd);
      const di = fd.querySelector('#inspD');
      di.value = trimNum(e.r * 2);
      di.addEventListener('input', () => {
        const v = parseFloat(di.value);
        if (!(v > 0)) return;
        e.r = v / 2;
        solveAll(); render();
      });
      const cRow = document.createElement('label'); cRow.className = 'check-row';
      cRow.innerHTML = `<input type="checkbox" id="inspConstruction">構築線にする`;
      inspectorEl.appendChild(cRow);
      const cChk = cRow.querySelector('#inspConstruction');
      cChk.checked = e.construction;
      cChk.addEventListener('change', () => { e.construction = cChk.checked; render(); });
    }

    const refs = constraintsFor(e.id);
    if (refs.length){
      const label = document.createElement('p'); label.className = 'tool-group-label';
      label.textContent = 'この図形に関わる拘束';
      inspectorEl.appendChild(label);
      for (const c of refs){
        const badge = document.createElement('div'); badge.className = 'constraint-badge';
        const text = document.createElement('span');
        text.textContent = CONSTRAINT_LABELS[c.type] + (c.value != null ? ` (${trimNum(c.value)}mm)` : '');
        badge.appendChild(text);
        const rm = document.createElement('button'); rm.className = 'ghost-sm'; rm.textContent = '解除';
        rm.addEventListener('click', () => deleteConstraint(c.id));
        badge.appendChild(rm);
        inspectorEl.appendChild(badge);
      }
    }

    const delBtn = document.createElement('button'); delBtn.className = 'danger';
    delBtn.textContent = `この${TYPE_LABEL[e.type]}を削除`;
    delBtn.addEventListener('click', () => deleteEntities([e.id]));
    inspectorEl.appendChild(delBtn);
  }

  function deleteConstraint(id){
    const idx = constraints.findIndex(c => c.id === id);
    if (idx === -1) return;
    constraints.splice(idx, 1);
    solveAll(); render(); renderInspector(); updateCommandAvailability();
    setStatus('拘束を解除しました。');
  }

  function deleteEntities(ids){
    const idSet = new Set(ids);
    let changed = true;
    while (changed){
      changed = false;
      for (const e of entities){
        if (idSet.has(e.id)) continue;
        if (e.type === 'line' && (idSet.has(e.p1) || idSet.has(e.p2))){ idSet.add(e.id); changed = true; }
        if (e.type === 'circle' && idSet.has(e.center)){ idSet.add(e.id); changed = true; }
      }
    }
    for (let i = entities.length - 1; i >= 0; i--) if (idSet.has(entities[i].id)) entities.splice(i, 1);
    for (let i = constraints.length - 1; i >= 0; i--){
      if (constraints[i].refs.some(r => idSet.has(r))) constraints.splice(i, 1);
    }
    selectedIds = selectedIds.filter(id => !idSet.has(id));
    solveAll(); render(); renderInspector(); updateCommandAvailability();
    setStatus(`${idSet.size}個の図形を削除しました。`);
  }

  // ---------- ツール状態 ----------
  let activeTool = 'select';
  const toolButtons = { select: $('toolSelect'), point: $('toolPoint'), line: $('toolLine'), circle: $('toolCircle') };
  let drawState = null; // {kind:'line', firstId} | {kind:'circle', centerId}

  const hintBanner = $('hintBanner');
  const HINTS = {
    point: 'クリックした位置に点を配置します。',
    line: '始点をクリックし、続けて終点をクリックしてください(既存の点の近くでクリックすると接続されます)。',
    circle: '中心をクリックし、続けて半径を決める位置をクリックしてください(中心は既存の点に接続できます)。',
  };
  function refreshHint(){
    if (pendingCommand){
      hintBanner.textContent = `「${CONSTRAINT_LABELS[pendingCommand.type]}」: 対象の図形をクリックしてください(Escでキャンセル)`;
      hintBanner.style.display = 'block';
    } else {
      hintBanner.textContent = HINTS[activeTool] || '';
      hintBanner.style.display = HINTS[activeTool] ? 'block' : 'none';
    }
  }
  function setTool(name){
    if (pendingCommand){ pendingCommand = null; setStatus('拘束コマンドをキャンセルしました。'); }
    activeTool = name;
    drawState = null;
    for (const key in toolButtons) toolButtons[key].setAttribute('aria-pressed', key === name ? 'true' : 'false');
    canvasWrap.classList.toggle('draw-mode', name !== 'select');
    refreshHint();
    updateCommandAvailability();
  }
  for (const key in toolButtons) toolButtons[key].addEventListener('click', () => setTool(key));

  // ---------- 拘束コマンド ----------
  const selectionCountLabel = $('selectionCountLabel');
  function selKinds(){ return selectedIds.map(entityById).filter(Boolean); }
  function commandApplicable(){
    const sel = selKinds();
    const n = sel.length;
    const countType = t => sel.filter(e => e.type === t).length;
    return {
      coincident: n === 2 && countType('point') === 2,
      distance: (n === 2 && countType('point') === 2) || (n === 2 && countType('point') === 1 && countType('line') === 1),
      horizontal: (n === 1 && countType('line') === 1) || (n === 2 && countType('point') === 2),
      vertical: (n === 1 && countType('line') === 1) || (n === 2 && countType('point') === 2),
      parallel: n === 2 && countType('line') === 2,
      perpendicular: n === 2 && countType('line') === 2,
      equal: n === 2 && (countType('line') === 2 || countType('circle') === 2),
      tangent: n === 2 && countType('point') === 0 && countType('circle') >= 1 && countType('line') !== 2,
      diameter: n === 1 && countType('circle') === 1,
      fixed: n >= 1,
      construction: n >= 1 && countType('point') === 0,
      delete: n >= 1,
    };
  }
  const CMD_BUTTON_TYPE = {
    cmdCoincident: 'coincident', cmdDistance: 'distance', cmdHorizontal: 'horizontal', cmdVertical: 'vertical',
    cmdParallel: 'parallel', cmdPerpendicular: 'perpendicular', cmdEqual: 'equal', cmdTangent: 'tangent',
    cmdDiameter: 'diameter', cmdFixed: 'fixed', cmdConstruction: 'construction', cmdDelete: 'delete',
  };
  const SOLVER_TYPES = new Set(['coincident', 'distance', 'horizontal', 'vertical', 'parallel', 'perpendicular', 'equal', 'tangent', 'diameter']);

  function updateCommandAvailability(){
    const n = selectedIds.length;
    selectionCountLabel.textContent = pendingCommand
      ? `「${CONSTRAINT_LABELS[pendingCommand.type]}」: 対象を選択中(${n}個)`
      : `拘束(${n}個選択中)`;
    for (const id in CMD_BUTTON_TYPE){
      const type = CMD_BUTTON_TYPE[id];
      const btn = $(id);
      if (pendingCommand){
        const isActive = pendingCommand.type === type;
        btn.disabled = !isActive;
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      } else {
        btn.disabled = SOLVER_TYPES.has(type) && !slvs;
        btn.setAttribute('aria-pressed', 'false');
      }
    }
  }

  // 拘束コマンドの実行方法は3通りを統一的に扱う:
  //  1) 何も選択せずコマンドを押す → 対象・基準とも、続けてクリックして選ぶ(ピック待ちに入る)
  //  2) 一部だけ選択してコマンドを押す → 選択済みを対象として、残りをクリックして選ぶ(ピック待ちに入る)
  //  3) コマンドの条件を満たす数・組み合わせをあらかじめ選択してコマンドを押す → 即座に実行
  // 選択数・組み合わせの条件(引数)はコマンドごとに異なり、commandApplicable()が判定する。
  // ピック待ち中はキャンバスのクリックがselectedIdsへのトグル追加として働き、
  // 条件を満たした瞬間に自動実行される。
  function startOrFireCommand(type){
    if (pendingCommand && pendingCommand.type === type){
      pendingCommand = null;
      updateCommandAvailability(); refreshHint();
      setStatus('拘束コマンドをキャンセルしました。');
      return;
    }
    let value;
    if (type === 'distance' || type === 'diameter'){
      value = parseFloat($('constraintValue').value);
      if (!(value > 0)){ setStatus('値(mm)を正しく入力してください。', true); return; }
    }
    if (commandApplicable()[type]){
      fireCommand(type, value);
      return;
    }
    pendingCommand = { type, value };
    updateCommandAvailability(); refreshHint();
    setStatus(`「${CONSTRAINT_LABELS[type]}」: 対象の図形をクリックして選択してください。`);
  }

  function fireCommand(type, value){
    pendingCommand = null;
    if (type === 'fixed') return applyFixedToggle();
    if (type === 'construction') return applyConstructionToggle();
    if (type === 'delete') return applyDeleteSelection();
    addConstraintCmd(type, value);
  }

  function addConstraintCmd(type, value){
    const c = { id: nextConstraintId++, type, refs: [...selectedIds], value };
    constraints.push(c);
    if (!solveAll()){ constraints.pop(); render(); renderInspector(); updateCommandAvailability(); refreshHint(); return; }
    render(); renderInspector(); updateCommandAvailability(); refreshHint();
    setStatus(`拘束「${CONSTRAINT_LABELS[type]}」を追加しました。`);
  }

  function applyFixedToggle(){
    const sel = selKinds();
    if (!sel.length){ updateCommandAvailability(); refreshHint(); return; }
    const pts = new Set();
    for (const e of sel){
      if (e.type === 'point') pts.add(e.id);
      else if (e.type === 'line'){ pts.add(e.p1); pts.add(e.p2); }
      else if (e.type === 'circle') pts.add(e.center);
    }
    const ptEntities = [...pts].map(entityById).filter(Boolean);
    const allFixed = ptEntities.every(p => p.fixed);
    for (const p of ptEntities) p.fixed = !allFixed;
    solveAll(); render(); renderInspector(); updateCommandAvailability(); refreshHint();
    setStatus(allFixed ? '固定を解除しました。' : '固定しました。');
  }

  function applyConstructionToggle(){
    const sel = selKinds().filter(e => e.type !== 'point');
    if (!sel.length){ updateCommandAvailability(); refreshHint(); return; }
    const allConstruction = sel.every(e => e.construction);
    for (const e of sel) e.construction = !allConstruction;
    render(); updateCommandAvailability(); refreshHint();
    setStatus(allConstruction ? '構築線を解除しました。' : '構築線にしました。');
  }

  function applyDeleteSelection(){
    if (!selectedIds.length){ updateCommandAvailability(); refreshHint(); return; }
    deleteEntities([...selectedIds]);
    refreshHint();
  }

  for (const id in CMD_BUTTON_TYPE){
    $(id).addEventListener('click', () => startOrFireCommand(CMD_BUTTON_TYPE[id]));
  }

  // ---------- ポインタ操作 ----------
  function distPointToSegment(p, a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-9) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  function hitTest(mx, my){
    const sp = toScreen(mx, my);
    for (const e of entities){
      if (e.type !== 'point') continue;
      const p = toScreen(e.x, e.y);
      if (Math.hypot(p.x - sp.x, p.y - sp.y) <= 9) return e;
    }
    let best = null, bestD = Infinity;
    for (const e of entities){
      if (e.type !== 'line') continue;
      const a = entityById(e.p1), b = entityById(e.p2);
      if (!a || !b) continue;
      const d = distPointToSegment(sp, toScreen(a.x, a.y), toScreen(b.x, b.y));
      if (d <= 6 && d < bestD){ bestD = d; best = e; }
    }
    for (const e of entities){
      if (e.type !== 'circle') continue;
      const c = entityById(e.center);
      if (!c) continue;
      const cp = toScreen(c.x, c.y);
      const d = Math.abs(Math.hypot(sp.x - cp.x, sp.y - cp.y) - e.r * scale);
      if (d <= 6 && d < bestD){ bestD = d; best = e; }
    }
    return best;
  }
  function findNearbyPoint(mx, my){
    const sp = toScreen(mx, my);
    let best = null, bestD = 12;
    for (const e of entities){
      if (e.type !== 'point') continue;
      const p = toScreen(e.x, e.y);
      const d = Math.hypot(p.x - sp.x, p.y - sp.y);
      if (d < bestD){ bestD = d; best = e; }
    }
    return best;
  }
  function addPoint(x, y){
    const e = { id: nextEntityId++, type: 'point', x, y, fixed: false };
    entities.push(e);
    return e;
  }

  let dragState = null; // {kind:'point', id} | {kind:'pan', ...}

  canvasWrap.addEventListener('pointerdown', e => {
    const sp = svgPointFromEvent(e);
    const mp = toModel(sp.x, sp.y);

    if (activeTool === 'select'){
      const hit = hitTest(mp.x, mp.y);

      if (pendingCommand){
        if (hit){
          const idx = selectedIds.indexOf(hit.id);
          if (idx === -1) selectedIds.push(hit.id); else selectedIds.splice(idx, 1);
          render(); renderInspector(); updateCommandAvailability(); refreshHint();
          if (commandApplicable()[pendingCommand.type]){
            const { type, value } = pendingCommand;
            fireCommand(type, value);
          }
        }
        return; // ピック待ち中は空クリックでのパン開始やドラッグは行わない
      }

      if (hit){
        if (e.shiftKey){
          const idx = selectedIds.indexOf(hit.id);
          if (idx === -1) selectedIds.push(hit.id); else selectedIds.splice(idx, 1);
        } else {
          selectedIds = [hit.id];
        }
        render(); renderInspector(); updateCommandAvailability();
        const sole = !e.shiftKey && selectedIds.length === 1 && selectedIds[0] === hit.id;
        if (sole && hit.type === 'point' && !hit.fixed){
          dragState = { kind: 'point', id: hit.id };
          canvasWrap.setPointerCapture(e.pointerId);
        } else if (sole && hit.type === 'point' && hit.fixed){
          setStatus(`点#${hit.id}は固定されているため直接ドラッグできません。`);
        }
      } else {
        if (!e.shiftKey) selectedIds = [];
        render(); renderInspector(); updateCommandAvailability();
        dragState = { kind: 'pan', startPanX: panX, startPanY: panY, startSx: sp.x, startSy: sp.y };
        canvasWrap.classList.add('panning');
        canvasWrap.setPointerCapture(e.pointerId);
      }
      return;
    }

    if (activeTool === 'point'){
      if (hitTest(mp.x, mp.y)) return;
      const p = addPoint(mp.x, mp.y);
      selectedIds = [p.id];
      solveAll(); render(); renderInspector(); updateCommandAvailability();
      setStatus(`点#${p.id}を配置しました。`);
      return;
    }

    if (activeTool === 'line'){
      const existing = findNearbyPoint(mp.x, mp.y);
      const pt = existing || addPoint(mp.x, mp.y);
      if (!drawState){
        drawState = { kind: 'line', firstId: pt.id };
        selectedIds = [pt.id];
        render(); renderInspector();
        setStatus('次の点をクリックして線分を確定してください。');
      } else {
        if (pt.id === drawState.firstId){ drawState = null; return; }
        const line = { id: nextEntityId++, type: 'line', p1: drawState.firstId, p2: pt.id, construction: false };
        entities.push(line);
        selectedIds = [line.id];
        drawState = null;
        solveAll(); render(); renderInspector(); updateCommandAvailability();
        setStatus(`線分#${line.id}を配置しました。`);
      }
      return;
    }

    if (activeTool === 'circle'){
      if (!drawState){
        const existing = findNearbyPoint(mp.x, mp.y);
        const pt = existing || addPoint(mp.x, mp.y);
        drawState = { kind: 'circle', centerId: pt.id };
        selectedIds = [pt.id];
        render(); renderInspector();
        setStatus('半径を決める位置をクリックしてください。');
      } else {
        const center = entityById(drawState.centerId);
        const r = Math.hypot(mp.x - center.x, mp.y - center.y) || 1;
        const circle = { id: nextEntityId++, type: 'circle', center: drawState.centerId, r, construction: false };
        entities.push(circle);
        selectedIds = [circle.id];
        drawState = null;
        solveAll(); render(); renderInspector(); updateCommandAvailability();
        setStatus(`円#${circle.id}(⌀${trimNum(r * 2)}mm)を配置しました。`);
      }
      return;
    }
  });

  canvasWrap.addEventListener('pointermove', e => {
    if (!dragState) return;
    const sp = svgPointFromEvent(e);
    if (dragState.kind === 'point'){
      const mp = toModel(sp.x, sp.y);
      const pt = entityById(dragState.id);
      if (pt){ pt.x = mp.x; pt.y = mp.y; solveAll(dragState.id); render(); renderInspector(); }
    } else if (dragState.kind === 'pan'){
      panX = dragState.startPanX + (sp.x - dragState.startSx);
      panY = dragState.startPanY + (sp.y - dragState.startSy);
      render();
    }
  });
  function endDrag(){
    if (dragState && dragState.kind === 'pan') canvasWrap.classList.remove('panning');
    dragState = null;
  }
  canvasWrap.addEventListener('pointerup', endDrag);
  canvasWrap.addEventListener('pointercancel', endDrag);

  canvasWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const sp = svgPointFromEvent(e);
    const before = toModel(sp.x, sp.y);
    const factor = Math.exp(-e.deltaY * 0.001);
    scale = Math.min(Math.max(scale * factor, 0.2), 200);
    const after = toModel(sp.x, sp.y);
    panX += (after.x - before.x) * scale;
    panY -= (after.y - before.y) * scale;
    render();
  }, { passive: false });

  $('zoomInBtn').addEventListener('click', () => { scale = Math.min(scale * 1.3, 200); render(); });
  $('zoomOutBtn').addEventListener('click', () => { scale = Math.max(scale / 1.3, 0.2); render(); });
  $('fitViewBtn').addEventListener('click', fitView);
  $('clearAllBtn').addEventListener('click', () => {
    if (!entities.length) return;
    if (!confirm('すべての図形を消去します。よろしいですか?')) return;
    entities.length = 0; constraints.length = 0; selectedIds = [];
    nextEntityId = 1; nextConstraintId = 1; drawState = null;
    render(); renderInspector(); updateCommandAvailability();
    setStatus('すべて消去しました。');
  });
  $('showDims').addEventListener('change', render);
  $('showGrid').addEventListener('change', render);

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      selectedIds = []; setTool('select'); render(); renderInspector(); updateCommandAvailability();
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIds.length && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      deleteEntities([...selectedIds]);
    }
  });

  window.addEventListener('resize', () => render());

  resetView();
  render();
  updateCommandAvailability();

  slvsReadyPromise.then(() => {
    updateCommandAvailability();
    setStatus('準備ができました。左の描画ツールで点・線分・円を配置できます。');
  }).catch(err => {
    console.error('計算エンジンの読み込みに失敗しました:', err);
    setStatus('計算エンジン(slvs.js)の読み込みに失敗しました。ページを再読み込みしてください。', true);
  });
})();
</script>
</body>
</html>
