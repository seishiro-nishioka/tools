<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ODB++ → KiCad 変換</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1B2733; --sub:#5A6878; --line:#CBD4DE;
  --red:#E0301E; --blue:#2B5C8A; --warn:#B26A00;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
    --red:#FF5040; --blue:#5B93C9; --warn:#E0A040;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --panel:#1C242D; --ink:#E6ECF2; --sub:#9AA8B6; --line:#33404D;
  --red:#FF5040; --blue:#5B93C9; --warn:#E0A040;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:14.5px; line-height:1.5;
  display:flex; flex-direction:column; min-height:100vh;
}
header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:12px 18px 6px}
.back-link{
  flex:none; font-size:12.5px; color:var(--sub); text-decoration:none;
  padding:4px 9px; border-radius:5px; border:1px solid var(--line); order:-1;
}
.back-link:hover{border-color:var(--blue); color:var(--ink)}
h1{margin:0; font-size:19px; font-weight:700; letter-spacing:.02em}
header p{margin:0; color:var(--sub); font-size:12.5px}
main{
  display:grid; grid-template-columns:360px minmax(0,1fr); gap:1px;
  background:var(--line); flex:1; min-height:0;
}
@media (max-width: 860px){ main{grid-template-columns:1fr} }
.panel{background:var(--panel); min-width:0; display:flex; flex-direction:column}
.pad{padding:12px; display:flex; flex-direction:column; gap:10px}
.dropzone{
  border:2px dashed var(--line); border-radius:8px; padding:18px 10px; text-align:center;
  color:var(--sub); font-size:12.5px; cursor:pointer;
}
.dropzone:hover,.dropzone.drag-over{background:var(--bg); border-color:var(--blue)}
.dropzone b{display:block; color:var(--ink); font-size:13.5px; margin-bottom:2px}
.label{font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.03em; margin:4px 0 0}
hr.sep{border:0; border-top:1px solid var(--line); margin:2px 0; width:100%}
button{font:inherit}
.btn-row{display:flex; gap:6px; flex-wrap:wrap}
button.ghost{
  font-size:12.5px; padding:6px 9px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); cursor:pointer;
}
button.ghost:hover{border-color:var(--blue)}
button.ghost[aria-pressed="true"]{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
button.primary{
  font-size:13px; padding:8px 10px; border-radius:6px; border:1px solid var(--red);
  background:var(--red); color:#fff; cursor:pointer; font-weight:700;
}
button:disabled{opacity:.4; cursor:not-allowed}
.stats{font-size:12.5px; display:grid; grid-template-columns:auto 1fr; gap:1px 10px}
.stats b{font-variant-numeric:tabular-nums}
.layer-table{width:100%; border-collapse:collapse; font-size:12px}
.layer-table td,.layer-table th{padding:3px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
.layer-table th{color:var(--sub); font-weight:500}
.layer-table td.name{word-break:break-all}
.layer-table td.type{color:var(--sub); font-size:11px}
.layer-table select{font:inherit; font-size:12px; max-width:120px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:4px}
.layer-scroll{max-height:40vh; overflow:auto}
ul.warns{margin:0; padding-left:18px; font-size:12px; color:var(--warn)}
select.step{font:inherit; font-size:12.5px}
.viewer{display:flex; flex-direction:column; min-height:60vh; height:100%}
.viewer-head{flex:none; padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.viewer-head .hint{font-size:11.5px; color:var(--sub)}
.canvas-wrap{flex:1; position:relative; min-height:300px; background:#101418}
canvas#view{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab}
.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8a97a5; font-size:13px; text-align:center; padding:20px}
#status{flex:none; padding:6px 14px; font-size:12.5px; color:var(--sub); min-height:1.6em; background:var(--panel); border-top:1px solid var(--line)}
#status.error{color:var(--red)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <a class="back-link" href="../">← 一覧</a>
  <h1>ODB++ → KiCad 変換</h1>
  <p>ODB++ の基板データを KiCad で閲覧できる .kicad_pcb (KiCad 9/10 用) に変換します。ファイルはサーバーに送信されず、処理はすべてブラウザ内で完結します。</p>
</header>
<main>
  <section class="panel">
    <div class="pad">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <b>ODB++ をドロップ</b>
        zip / tgz / tar、またはフォルダ
      </div>
      <div class="btn-row">
        <button type="button" class="ghost" id="pickFile">ファイルを選ぶ</button>
        <button type="button" class="ghost" id="pickDir">フォルダを選ぶ</button>
      </div>
      <input type="file" id="fileInput" class="sr" accept=".zip,.tgz,.gz,.tar">
      <input type="file" id="dirInput" class="sr" webkitdirectory multiple>
      <div id="stepRow" style="display:none"><span class="label">ステップ</span> <select class="step" id="stepSel"></select></div>
      <div id="result" style="display:none">
        <p class="label">結果</p>
        <div class="stats" id="stats"></div>
        <div class="btn-row" style="margin-top:8px">
          <button type="button" class="primary" id="download">.kicad_pcb をダウンロード</button>
        </div>
      </div>
      <div id="layersBox" style="display:none">
        <hr class="sep">
        <p class="label">層の割り当て (空の層は省略)</p>
        <div class="layer-scroll"><table class="layer-table"><thead><tr><th>ODB++ 層</th><th>種類</th><th>KiCad 層</th></tr></thead><tbody id="layerRows"></tbody></table></div>
        <div class="btn-row" style="margin-top:6px"><button type="button" class="ghost" id="reconvert" disabled>割り当てを反映して再変換</button></div>
      </div>
      <div id="warnBox" style="display:none">
        <hr class="sep">
        <p class="label">警告</p>
        <ul class="warns" id="warns"></ul>
      </div>
    </div>
  </section>
  <section class="panel">
    <div class="viewer">
      <div class="viewer-head">
        <button type="button" class="ghost" id="viewTop" aria-pressed="true">表</button>
        <button type="button" class="ghost" id="viewBot" aria-pressed="false">裏 (裏から見た向き)</button>
        <button type="button" class="ghost" id="viewFit">全体表示</button>
        <span class="hint">ホイール / ピンチで拡大、ドラッグで移動</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="view"></canvas>
        <div class="empty" id="empty">ODB++ を読み込むと、ここにプレビューを表示します。</div>
      </div>
    </div>
  </section>
</main>
<div id="status"></div>

<script id="core">
'use strict';
/* ODB++ -> KiCad core (no DOM). Units: mm, ODB++ Y-up; KiCad output Y-down. */
const Odb = (() => {
const C = (typeof ClipperLib !== 'undefined') ? ClipperLib : globalThis.ClipperLib;
const SC = 1e4;          // clipper integer units per mm
const QS = 16;           // segments per quarter circle
const MIN_W = 0.1;       // width for zero-width strokes (mm)
const TOL = 0.002;       // max chord deviation for circles/arcs (mm)
const NF = C.PolyFillType.pftNonZero;

/* ---------------- warnings */
let warnings = new Map();
function warn(msg) { warnings.set(msg, (warnings.get(msg) || 0) + 1); }

/* ---------------- geometry (clipper paths, outers CCW / holes CW) */
const toI = (x, y) => ({ X: Math.round(x * SC), Y: Math.round(y * SC) });
function pathF(pts) {
  const p = pts.map(([x, y]) => toI(x, y));
  if (C.Clipper.Area(p) < 0) p.reverse();
  return p;
}
function clip(subj, clp, type, tree) {
  const c = new C.Clipper();
  c.AddPaths(subj, C.PolyType.ptSubject, true);
  if (clp) c.AddPaths(clp, C.PolyType.ptClip, true);
  const out = tree ? new C.PolyTree() : [];
  c.Execute(type, out, NF, NF);
  return out;
}
function unionFlat(a) { return a.length ? clip(a, null, C.ClipType.ctUnion) : []; }
/* Union of many paths: merge spatially sorted chunks pairwise (keeps the sweep's active edge list short). */
function union(a) {
  if (a.length <= 400) return unionFlat(a);
  const keyed = a.map(p => { let s = 0; for (const q of p) s += q.X; return [s / p.length, p]; });
  keyed.sort((u, v) => u[0] - v[0]);
  let parts = [];
  for (let i = 0; i < keyed.length; i += 200) parts.push(unionFlat(keyed.slice(i, i + 200).map(k => k[1])));
  while (parts.length > 1) {
    const next = [];
    for (let i = 0; i < parts.length; i += 2) next.push(i + 1 < parts.length ? unionFlat(parts[i].concat(parts[i + 1])) : parts[i]);
    parts = next;
  }
  return parts[0];
}
const diff = (a, b) => !a.length ? [] : !b.length ? union(a) : clip(a, b, C.ClipType.ctDifference);
const area = paths => paths.reduce((s, p) => s + C.Clipper.Area(p), 0) / (SC * SC);
function bbox(paths) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of paths) for (const q of p) {
    if (q.X < x0) x0 = q.X; if (q.X > x1) x1 = q.X; if (q.Y < y0) y0 = q.Y; if (q.Y > y1) y1 = q.Y;
  }
  return [x0 / SC, y0 / SC, x1 / SC, y1 / SC];
}
function segCount(r) {
  // segments for a full circle: at most QS*4, fewer for small radii (deviation <= TOL), multiple of 4
  if (r <= TOL) return 8;
  const n = Math.ceil(Math.PI / Math.acos(1 - TOL / r));
  return Math.min(QS * 4, Math.max(8, Math.ceil(n / 4) * 4));
}
function circleF(cx, cy, r, n = segCount(r)) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return pts;
}
/* Mirror (x -> -x) first, then rotate clockwise by angle (ODB++), then translate. */
function xform(paths, mirror, angle, x, y) {
  const a = -angle * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return paths.map(p => {
    const q = p.map(pt => {
      let px = pt.X / SC; const py = pt.Y / SC;
      if (mirror) px = -px;
      return toI(x + px * c - py * s, y + px * s + py * c);
    });
    if (mirror) q.reverse();
    return q;
  });
}
function arcPoints(xs, ys, xe, ye, xc, yc, cw) {
  const r = Math.hypot(xs - xc, ys - yc);
  const a0 = Math.atan2(ys - yc, xs - xc), a1 = Math.atan2(ye - yc, xe - xc);
  let sweep;
  if (cw) { sweep = a0 - a1; if (sweep <= 1e-9) sweep += 2 * Math.PI; sweep = -sweep; }
  else { sweep = a1 - a0; if (sweep <= 1e-9) sweep += 2 * Math.PI; }
  const n = Math.max(4, Math.floor(Math.abs(sweep) / (2 * Math.PI) * segCount(r)));
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push([xc + r * Math.cos(a0 + sweep * i / n), yc + r * Math.sin(a0 + sweep * i / n)]);
  pts[n] = [xe, ye];
  return pts;
}
function strokePath(pts, st) {
  const w = st.w > 0 ? st.w : MIN_W;
  const same = pts.every(p => Math.abs(p[0] - pts[0][0]) < 1e-9 && Math.abs(p[1] - pts[0][1]) < 1e-9);
  if (same) {
    const [x, y] = pts[0];
    if (st.cap === 'square') return [pathF([[x - w / 2, y - w / 2], [x + w / 2, y - w / 2], [x + w / 2, y + w / 2], [x - w / 2, y + w / 2]])];
    return [pathF(circleF(x, y, w / 2))];
  }
  const r = w / 2 * SC;
  const co = new C.ClipperOffset(2, Math.max(0.25, TOL * SC, r * (1 - Math.cos(Math.PI / (QS * 4)))));
  const sq = st.cap === 'square';
  co.AddPath(pts.map(([x, y]) => toI(x, y)), sq ? C.JoinType.jtMiter : C.JoinType.jtRound, sq ? C.EndType.etOpenSquare : C.EndType.etOpenRound);
  const out = [];
  co.Execute(out, r);
  return out;
}

/* ---------------- standard symbols (dimensions in symbol units * k -> mm) */
function rectCorners(w, h, r, corners, chamfer) {
  // corners: 1=top-right 2=top-left 3=bottom-left 4=bottom-right
  const pts = [];
  const cs = [[4, w / 2, -h / 2, -90], [1, w / 2, h / 2, 0], [2, -w / 2, h / 2, 90], [3, -w / 2, -h / 2, 180]];
  for (const [id, cx, cy, a0] of cs) {
    if (r > 0 && corners.includes(String(id))) {
      const sx = Math.sign(cx), sy = Math.sign(cy);
      if (chamfer) {
        // entering point then leaving point, CCW
        const p1 = (a0 === -90 || a0 === 90) ? [cx - sx * r, cy] : [cx, cy - sy * r];
        const p2 = (a0 === -90 || a0 === 90) ? [cx, cy - sy * r] : [cx - sx * r, cy];
        pts.push(p1, p2);
      } else {
        const ox = cx - sx * r, oy = cy - sy * r;
        for (let i = 0; i <= QS; i++) {
          const a = (a0 + 90 * i / QS) * Math.PI / 180;
          pts.push([ox + r * Math.cos(a), oy + r * Math.sin(a)]);
        }
      }
    } else pts.push([cx, cy]);
  }
  return pts;
}
function spokesCut(ringPaths, nSp, angle, gap, len) {
  const cuts = [];
  for (let i = 0; i < nSp; i++) {
    const a = (angle + 360 * i / nSp) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const q = [[0, -gap / 2], [len, -gap / 2], [len, gap / 2], [0, gap / 2]].map(([x, y]) => [x * c - y * s, x * s + y * c]);
    cuts.push(pathF(q));
  }
  return diff(ringPaths, cuts);
}
const stdCache = new Map();
function stdSymbol(name, k) {
  const key = name + '|' + k;
  if (stdCache.has(key)) return stdCache.get(key);
  const v = stdSymbolCalc(name, k);
  stdCache.set(key, v);
  return v;
}
function stdSymbolCalc(name, k) {
  const num = s => parseFloat(s) * k;
  let m;
  if ((m = /^r([\d.]+)$/.exec(name))) {
    const d = num(m[1]);
    return { paths: d > 0 ? [pathF(circleF(0, 0, d / 2))] : [], stroke: { cap: 'round', w: d } };
  }
  if ((m = /^s([\d.]+)$/.exec(name))) {
    const s = num(m[1]);
    return { paths: [pathF([[-s / 2, -s / 2], [s / 2, -s / 2], [s / 2, s / 2], [-s / 2, s / 2]])], stroke: { cap: 'square', w: s } };
  }
  if ((m = /^rect([\d.]+)x([\d.]+)(?:x(r|c)([\d.]+)(?:x(\d+))?)?$/.exec(name))) {
    const w = num(m[1]), h = num(m[2]);
    const r = m[4] ? Math.min(num(m[4]), w / 2, h / 2) : 0;
    return { paths: [pathF(rectCorners(w, h, r, m[5] || '1234', m[3] === 'c'))] };
  }
  if ((m = /^oval([\d.]+)x([\d.]+)$/.exec(name))) {
    const w = num(m[1]), h = num(m[2]);
    return { paths: [pathF(rectCorners(w, h, Math.min(w, h) / 2, '1234', false))] };
  }
  if ((m = /^di([\d.]+)x([\d.]+)$/.exec(name))) {
    const w = num(m[1]), h = num(m[2]);
    return { paths: [pathF([[w / 2, 0], [0, h / 2], [-w / 2, 0], [0, -h / 2]])] };
  }
  if ((m = /^oct([\d.]+)x([\d.]+)x([\d.]+)$/.exec(name))) {
    return { paths: [pathF(rectCorners(num(m[1]), num(m[2]), num(m[3]), '1234', true))] };
  }
  if ((m = /^donut_r([\d.]+)x([\d.]+)$/.exec(name))) {
    return { paths: diff([pathF(circleF(0, 0, num(m[1]) / 2))], [pathF(circleF(0, 0, num(m[2]) / 2))]) };
  }
  if ((m = /^donut_s([\d.]+)x([\d.]+)$/.exec(name))) {
    const o = num(m[1]) / 2, i = num(m[2]) / 2;
    return { paths: diff([pathF([[-o, -o], [o, -o], [o, o], [-o, o]])], [pathF([[-i, -i], [i, -i], [i, i], [-i, i]])]) };
  }
  if ((m = /^el([\d.]+)x([\d.]+)$/.exec(name))) {
    const w = num(m[1]) / 2, h = num(m[2]) / 2;
    return { paths: [pathF(circleF(0, 0, 1).map(([x, y]) => [x * w, y * h]))] };
  }
  if ((m = /^tri([\d.]+)x([\d.]+)$/.exec(name))) {
    const b = num(m[1]), h = num(m[2]);
    return { paths: [pathF([[-b / 2, -h / 2], [b / 2, -h / 2], [0, h / 2]])] };
  }
  if ((m = /^hex_l([\d.]+)x([\d.]+)x([\d.]+)$/.exec(name))) {
    const w = num(m[1]), h = num(m[2]), r = num(m[3]);
    return { paths: [pathF([[-w / 2, 0], [-w / 2 + r, -h / 2], [w / 2 - r, -h / 2], [w / 2, 0], [w / 2 - r, h / 2], [-w / 2 + r, h / 2]])] };
  }
  if ((m = /^hex_s([\d.]+)x([\d.]+)x([\d.]+)$/.exec(name))) {
    const w = num(m[1]), h = num(m[2]), r = num(m[3]);
    return { paths: [pathF([[0, -h / 2], [w / 2, -h / 2 + r], [w / 2, h / 2 - r], [0, h / 2], [-w / 2, h / 2 - r], [-w / 2, -h / 2 + r]])] };
  }
  if ((m = /^(thr|ths)([\d.]+)x([\d.]+)x([\d.]+)x(\d+)x([\d.]+)$/.exec(name))) {
    const od = num(m[2]), id = num(m[3]);
    if (m[1] === 'ths') warn('角端の熱抵抗シンボル (ths) を丸端として描画: ' + name);
    const ring = diff([pathF(circleF(0, 0, od / 2))], [pathF(circleF(0, 0, id / 2))]);
    return { paths: spokesCut(ring, +m[5], +m[4], num(m[6]), od) };
  }
  if ((m = /^s_ths([\d.]+)x([\d.]+)x([\d.]+)x(\d+)x([\d.]+)$/.exec(name))) {
    const o = num(m[1]) / 2, i = num(m[2]) / 2;
    const ring = diff([pathF([[-o, -o], [o, -o], [o, o], [-o, o]])], [pathF([[-i, -i], [i, -i], [i, i], [-i, i]])]);
    return { paths: spokesCut(ring, +m[4], +m[3], num(m[5]), o * 2) };
  }
  if (/^null\d*$/.test(name)) return { paths: [] };
  return null;
}

/* ---------------- features files */
function stripAttr(l) { const i = l.indexOf(';'); return i >= 0 ? l.slice(0, i) : l; }
function unitsOf(lines, def) {
  for (const l of lines) {
    const m = /^\s*(?:U\s+|UNITS\s*=\s*)(MM|INCH)\b/i.exec(l);
    if (m) return m[1].toUpperCase();
  }
  return def;
}
/* lib: { get(name) -> paths | null } for user symbols */
function parseFeatures(text, lib, label) {
  const lines = text.split(/\r?\n/);
  const unit = unitsOf(lines.slice(0, 50), 'INCH');
  const ks = unit === 'MM' ? 1 : 25.4;        // coordinates -> mm
  const symK = unit === 'MM' ? 0.001 : 0.0254; // symbol dims (um or mil) -> mm
  const syms = {};
  const items = [], pads = [], lines_ = [];
  const symShape = sym => {
    const s = stdSymbol(sym.name, sym.k);
    if (s) return s.paths;
    const u = lib.get(sym.name);
    if (u) return u;
    warn('未対応のシンボル: ' + sym.name);
    return null;
  };
  const strokeOf = sym => {
    const s = stdSymbol(sym.name, sym.k);
    if (s && s.stroke) return s.stroke;
    warn('丸・角以外のシンボルの線を丸線として描画: ' + sym.name);
    const sh = symShape(sym);
    if (sh && sh.length) { const b = bbox(sh); return { cap: 'round', w: b[2] - b[0] }; }
    return { cap: 'round', w: MIN_W };
  };
  let i = 0;
  const N = lines.length;
  while (i < N) {
    const raw = lines[i++];
    if (!raw || raw[0] === '#' || raw[0] === '@' || raw[0] === '&') continue;
    const t = stripAttr(raw).trim().split(/\s+/);

async function loadJob(fs, root) {

  if (!matrixText) throw new Error('matrix/matrix が見つかりません');
  const matrix = parseMatrix(matrixText);
  const stepDirs = new Set();
  for (const p of fs.list(root + 'steps/')) { const s = p.split('/')[0]; if (s) stepDirs.add(s); }
  const steps = [...stepDirs];
  // prefer the top-level panel (a step with STEP-REPEAT that no other step uses), then single boards with eda data
  const reps = new Map(), used = new Set();
  for (const s of steps) {
    const r = parseStephdr(await fs.text(root + `steps/${s}/stephdr`)).repeats;
    reps.set(s, r.length);
    for (const x of r) used.add(x.name);
  }
  const score = s => (reps.get(s) ? (used.has(s.toLowerCase()) ? 4 : 8) : 0) +
    (fs.has(root + `steps/${s}/eda/data`) ? 2 : 0) + (fs.has(root + `steps/${s}/profile`) ? 1 : 0);

  const { fs, root } = job;
  const symCache = new Map(), symBusy = new Set(), symTexts = new Map();
  const symDirs = new Set(fs.list(root + 'symbols/').map(p => p.split('/')[0]).filter(Boolean));
  for (const s of symDirs) { const t = await fs.text(root + `symbols/${s}/features`); if (t != null) symTexts.set(s, t); }

async function flatStep(job, step, progress, stack, cache) {

    const name = job.steps.find(s => s.toLowerCase() === r.name);
    if (!name) { warn('面付けの子ステップが見つからない: ' + r.name); continue; }

async function loadStep(job, step, progress) {

function parseComponents(text) {
  const lines = text.split(/\r?\n/);
  const k = unitsOf(lines.slice(0, 50), 'INCH') === 'MM' ? 1 : 25.4;
  const comps = [];
  let cur = null;
  for (const raw of lines) {
    const t = stripAttr(raw).trim().split(/\s+/);
    if (t[0] === 'CMP') {
      cur = { pkg: parseInt(t[1], 10), x: parseFloat(t[2]) * k, y: parseFloat(t[3]) * k, rot: parseFloat(t[4]), mirror: t[5] === 'M', ref: t[6] || '', value: t[7] || '', pins: [] };
      comps.push(cur);
    } else if ((t[0] === 'TOP' || t[0] === 'BOT') && cur) {
      cur.pins.push({ x: parseFloat(t[2]) * k, y: parseFloat(t[3]) * k, net: parseInt(t[6], 10), name: t[8] || String(parseInt(t[1], 10) + 1) });

  }
  return comps;
}

/* ---------------- pad / hole index */
class PadIndex {
  constructor(ffs) {
    this.cell = 0.5;
    this.grid = new Map();
    for (const ff of ffs) {
      if (!ff) continue;
      for (const p of ff.pads) {
        if (p.pol !== 'P' || !p.paths || !p.paths.length) continue;
        const it = { x: p.x, y: p.y, pad: p, area: Math.abs(area(p.paths)) };
        const key = Math.floor(p.x / this.cell) + ',' + Math.floor(p.y / this.cell);
        if (!this.grid.has(key)) this.grid.set(key, []);
        this.grid.get(key).push(it);
      }
    }
  }
  find(x, y, tol = 0.02) {
    let best = null;
    const cx = Math.floor(x / this.cell), cy = Math.floor(y / this.cell);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
      for (const it of this.grid.get((cx + i) + ',' + (cy + j)) || []) {

}
function holeList(st) {
  const holes = [];

    const span = drillSpan(st, l);
    for (const p of l.ff.pads) {
      if (p.pol !== 'P') continue;
      let m;
      if ((m = /^r([\d.]+)$/.exec(p.sym.name))) holes.push({ x: p.x, y: p.y, d: parseFloat(m[1]) * p.sym.k, slot: null, span, layer: l.name });
      else if ((m = /^oval([\d.]+)x([\d.]+)$/.exec(p.sym.name))) {
        const w = parseFloat(m[1]) * p.sym.k, h = parseFloat(m[2]) * p.sym.k;
        holes.push({ x: p.x, y: p.y, d: Math.min(w, h), slot: { w, h, angle: p.angle }, span, layer: l.name });
      } else warn('未対応の穴の形: ' + p.sym.name);
    }
    for (const ln of l.ff.lines) {
      if (ln.pol !== 'P') continue;
      const m = /^r([\d.]+)$/.exec(ln.sym.name);
      if (!m) { warn('未対応の穴の形 (線): ' + ln.sym.name); continue; }
      const d = parseFloat(m[1]) * ln.sym.k, len = Math.hypot(ln.x2 - ln.x1, ln.y2 - ln.y1);
      const ang = -Math.atan2(ln.y2 - ln.y1, ln.x2 - ln.x1) * 180 / Math.PI; // ODB++ CW angle
      holes.push({ x: (ln.x1 + ln.x2) / 2, y: (ln.y1 + ln.y2) / 2, d, slot: { w: len + d, h: d, angle: ang }, span, layer: l.name });

}
function drillSpan(st, l) {

  const cu = st.layers.filter(x => x.role === 'copper');
  if (!cu.length) return ['F.Cu', 'B.Cu'];
  const rowOf = n => { const e = st.layers.find(x => x.name.toLowerCase() === (n || '').toLowerCase()); return e ? e.row : null; };
  let r0 = rowOf(l.start), r1 = rowOf(l.end);

  if (r1 == null) r1 = cu[cu.length - 1].row;
  if (r0 > r1) [r0, r1] = [r1, r0];

  const a = inside.length ? inside[0] : cu[0], b = inside.length ? inside[inside.length - 1] : cu[cu.length - 1];

/* ---------------- KiCad writer */
const f6 = v => { const r = Math.round(v * 1e6) / 1e6; return (Object.is(r, -0) ? 0 : r).toString(); };

  const lines = [];
  for (let i = 0; i < parts.length; i += 6) lines.push(indent + parts.slice(i, i + 6).join(' '));

function buildBoard(st, opts = {}) {
  const out = [];

  const layerOf = name => st.layers.find(l => l.lname === name);
  const copperLayers = st.layers.filter(l => l.role === 'copper');
  const topCu = copperLayers[0] && copperLayers[0].ff, botCu = copperLayers.length > 1 ? copperLayers[copperLayers.length - 1].ff : null;
  const idx = { F: new PadIndex([topCu]), B: new PadIndex([botCu]) };

  /* targets */
  const byTarget = new Map();

  const netCode = [];

  st.nets.forEach((nm, i) => {
    if (!nm || nm === '$NONE$') { netCode[i] = 0; return; }
    let name = nm;
    if (seen.has(name)) name = `${nm}_${i}`;
    seen.set(name, 1);

  /* pads */
  const usedHoles = new Set();
  const holes = holeList(st);
  const holeGrid = new Map();
  holes.forEach((h, i) => {
    const key = Math.floor(h.x / 0.5) + ',' + Math.floor(h.y / 0.5);

    const orient = hole && hole.slot ? kicadAngle(hole.slot.angle) : 0; // ODB++ CW -> KiCad CCW

    L.push(`${indent}\t(at ${f6(lx)} ${f6(ly)}${orient ? ' ' + f6(orient) : ''})`);
    L.push(`${indent}\t(size 0.05 0.05)`);
    if (hole) {
      if (hole.slot) L.push(`${indent}\t(drill oval ${f6(hole.slot.w)} ${f6(hole.slot.h)})`);
      else L.push(`${indent}\t(drill ${f6(hole.d)})`);
    }
    L.push(`${indent}\t(layers ${layers.map(q).join(' ')})`);
    if (hole && !hole.npth) L.push(`${indent}\t(remove_unused_layers no)`);
    if (net) L.push(`${indent}\t${net}`);
    L.push(`${indent}\t(options`, `${indent}\t\t(clearance outline)`, `${indent}\t\t(anchor circle)`, `${indent}\t)`);
    if (geomPaths && geomPaths.length) {

      }

    `\t\t(property ${q(name)} ${q(val)}`, '\t\t\t(at 0 0 0)', `\t\t\t(layer ${q(layer)})`,
    ...(hidden ? ['\t\t\t(hide yes)'] : []), `\t\t\t(uuid ${q(uuid())})`,
    '\t\t\t(effects', '\t\t\t\t(font', '\t\t\t\t\t(size 0.4 0.4)', '\t\t\t\t\t(thickness 0.06)', '\t\t\t\t)',
    ...(mirror ? ['\t\t\t\t(justify mirror)'] : []), '\t\t\t)', '\t\t)'].join('\n');

  const allCu = ['*.Cu', '*.Mask'];
  for (const cl of st.layers.filter(l => l.role === 'comp')) {
    const side = cl.side;
    const sideCu = side === 'B' ? 'B.Cu' : 'F.Cu', fab = side === 'B' ? 'B.Fab' : 'F.Fab';
    for (const c of cl.comps) {
      const fpName = c.pkgName || '';
      const L = [`\t(footprint ${q(fpName)}`, `\t\t(layer ${q(sideCu)})`, `\t\t(uuid ${q(uuid())})`, `\t\t(at ${f6(c.x)} ${f6(-c.y)})`,
        textProp('Reference', c.ref, fab, false, side === 'B'), textProp('Value', c.value, fab, true, side === 'B')];
      c.pins.forEach((pin, i) => {
        const hi = findHole(pin.x, pin.y);
        const net = netRef(pin.net);
        if (hi != null) {

          const hit = findCu(pin.x, pin.y);
          L.push(padBlock(pin.name, pin.x, pin.y, c.x, c.y, hit && hit.paths, allCu, net, holes[hi], '\t\t'));

      viaLines.push(['\t(via' + (through ? '' : ' blind'), `\t\t(at ${f6(h.x)} ${f6(-h.y)})`, `\t\t(size ${f6(w)})`, `\t\t(drill ${f6(h.d)})`,
        `\t\t(layers ${q(h.span[0])} ${q(h.span[1])})`, '\t\t(net 0)', `\t\t(uuid ${q(uuid())})`, '\t)'].join('\n'));
      stats.vias++;

      const hh = hit ? h : Object.assign({}, h, { npth: true });
      extraPads.push(padBlock('', h.x, h.y, 0, 0, hit && hit.paths, hit ? allCu : allCu, null, hh, '\t\t'));
      stats.holes++;

  });

    out.push(['\t(footprint "HOLES"', '\t\t(layer "F.Cu")', `\t\t(uuid ${q(uuid())})`, '\t\t(at 0 0)',
      textProp('Reference', 'HOLES', 'F.Fab', true, false), textProp('Value', '', 'F.Fab', true, false),
      ...extraPads, '\t\t(embedded_fonts no)', '\t)'].join('\n'));
  }

  /* graphics */
  const preview = new Map();
  for (const [t, ls] of byTarget) {
    const g = ls.length === 1 ? layerGeometry(ls[0].ff) : union(ls.flatMap(l => layerGeometry(l.ff)));
    preview.set(t, g);
    for (const p of fracture(g)) {
      out.push(['\t(gr_poly', '\t\t(pts', ptsLines(p, (x, y) => [x, -y], '\t\t\t'), '\t\t)',

  for (const p of st.profile) {
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      out.push(['\t(gr_line', `\t\t(start ${f6(a.X / SC)} ${f6(-a.Y / SC)})`, `\t\t(end ${f6(b.X / SC)} ${f6(-b.Y / SC)})`,
        '\t\t(stroke', '\t\t\t(width 0.05)', '\t\t\t(type solid)', '\t\t)', '\t\t(layer "Edge.Cuts")', `\t\t(uuid ${q(uuid())})`, '\t)'].join('\n'));
    }
  }
  out.push(...viaLines);
  out.push('\t(embedded_fonts no)', ')', '');
  if (stats.padsNoCopper) warn(`銅箔の形が見つからないパッド ${stats.padsNoCopper} 個 (小さな丸で代用)`);
  return { text: out.join('\n'), stats, preview, holes, padCheck };
}

<script>
'use strict';
(() => {

const setStatus = (msg, err) => { statusEl.textContent = msg; statusEl.classList.toggle('error', !!err); };

const dz = $('dropzone');
dz.addEventListener('click', () => $('fileInput').click());
dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); } });
$('pickFile').addEventListener('click', () => $('fileInput').click());
$('pickDir').addEventListener('click', () => $('dirInput').click());
$('fileInput').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await openArchive(f); });
$('dirInput').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  const fs = new Odb.FileSet();
  for (const f of files) fs.add(f.webkitRelativePath || f.name, async () => new Uint8Array(await f.arrayBuffer()));
  await openFileSet(fs, files[0].webkitRelativePath.split('/')[0]);
});
['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('drag-over'); }));
['dragleave', 'drop'].forEach(t => dz.addEventListener(t, () => dz.classList.remove('drag-over')));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  const items = [...(e.dataTransfer.items || [])];
  const entries = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length === 1 && entries[0].isDirectory) {
    const fs = new Odb.FileSet();
    await walkEntry(entries[0], '', fs);
    await openFileSet(fs, entries[0].name);
    return;
  }
  const f = e.dataTransfer.files[0];
  if (f) await openArchive(f);
});
async function walkEntry(entry, prefix, fs) {
  if (entry.isFile) {
    fs.add(prefix + entry.name, () => new Promise((res, rej) => entry.file(async f => res(new Uint8Array(await f.arrayBuffer())), rej)));
    return;
  }
  const reader = entry.createReader();
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    for (const ch of batch) await walkEntry(ch, prefix + entry.name + '/', fs);
  }
}
async function openArchive(file) {
  try {
    await progress('読み込み中: ' + file.name);
    const fs = await Odb.fileSetFromArchive(file.name, new Uint8Array(await file.arrayBuffer()));
    await openFileSet(fs, file.name.replace(/\.(zip|tgz|tar\.gz|tar|gz)$/i, ''));
  } catch (err) { console.error(err); setStatus('エラー: ' + err.message, true); }
}
let baseName = 'board';
async function openFileSet(fs, name) {
  try {
    const roots = Odb.findJobs(fs);
    if (!roots.length) throw new Error('ODB++ のジョブ (matrix/matrix) が見つかりません');
    job = await Odb.loadJob(fs, roots[0]);
    const rootName = roots[0].replace(/\/$/, '').split('/').pop();
    baseName = rootName || name || 'board';
    const sel = $('stepSel');
    sel.innerHTML = '';
    for (const s of job.steps) { const o = document.createElement('option'); o.value = o.textContent = s; sel.appendChild(o); }
    $('stepRow').style.display = job.steps.length > 1 ? '' : 'none';
    if (!job.steps.length) throw new Error('steps フォルダが見つかりません');
    await openStep(job.steps[0]);
  } catch (err) { console.error(err); setStatus('エラー: ' + err.message, true); }
}
$('stepSel').addEventListener('change', e => openStep(e.target.value).catch(err => setStatus('エラー: ' + err.message, true)));

async function openStep(step) {
  Odb.resetWarnings();
  st = await Odb.loadStep(job, step, progress);
  renderLayerTable();
  await convert();
}

/* ---------- layer table */
function renderLayerTable() {
  const tb = $('layerRows');
  tb.innerHTML = '';
  const targets = Odb.graphicTargets(st.copperCount);
  for (const l of st.layers) {
    if (!l.count) continue;
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.className = 'name'; td1.textContent = l.name;
    const td2 = document.createElement('td'); td2.className = 'type'; td2.textContent = l.type + (l.context === 'MISC' ? ' (MISC)' : '');
    const td3 = document.createElement('td');
    if (l.role === 'copper') td3.textContent = l.target;
    else if (l.role === 'drill') td3.textContent = '穴 (パッド / ビア)';
    else if (l.role === 'comp') td3.textContent = `部品 ${l.count} 個 (${l.side === 'B' ? '裏' : '表'})`;
    else {
      const s = document.createElement('select');
      const none = document.createElement('option'); none.value = ''; none.textContent = '(除外)'; s.appendChild(none);
      for (const t of targets) { const o = document.createElement('option'); o.value = o.textContent = t; s.appendChild(o); }
      s.value = l.target || '';
      s.addEventListener('change', () => { l.target = s.value || null; $('reconvert').disabled = false; });
      td3.appendChild(s);
    }
    tr.append(td1, td2, td3);
    tb.appendChild(tr);
  }
  $('layersBox').style.display = '';
}
$('reconvert').addEventListener('click', async () => { $('reconvert').disabled = true; await convert(); });

/* ---------- convert */
async function convert() {
  try {
    await progress('変換中 (多角形の合成と分割)…');
    result = Odb.buildBoard(st);
    if (downloadUrl) URL.revokeObjectURL(downloadUrl);
    downloadUrl = URL.createObjectURL(new Blob([result.text], { type: 'text/plain' }));
    const s = result.stats;
    const rows = [...(st.instances ? [['面付け', st.instances + ' 枚']] : []), ['部品', s.components], ['パッド', s.pads], ['ネット', s.nets], ['ビア', s.vias], ['その他の穴', s.holes], ['塗りポリゴン', s.polygons],
      ['ファイルサイズ', (result.text.length / 1048576).toFixed(1) + ' MB']];
    $('stats').innerHTML = '';
    for (const [k, v] of rows) { const a = document.createElement('span'); a.textContent = k; const b = document.createElement('b'); b.textContent = v; $('stats').append(a, b); }
    $('result').style.display = '';
    const w = $('warns'); w.innerHTML = '';
    for (const [m, n] of Odb.warnings()) { const li = document.createElement('li'); li.textContent = m + (n > 1 ? ` (${n} 件)` : ''); w.appendChild(li); }
    $('warnBox').style.display = Odb.warnings().size ? '' : 'none';
    buildPreview();
    fit();
    setStatus('変換しました。「.kicad_pcb をダウンロード」で保存できます。');
  } catch (err) { console.error(err); setStatus('エラー: ' + err.message, true); }
}
$('download').addEventListener('click', () => {
  if (!downloadUrl) return;
  const a = document.createElement('a');
  a.href = downloadUrl; a.download = baseName + '.kicad_pcb';
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- preview */
const cv = $('view'), ctx = cv.getContext('2d');
let paths = null, bounds = null, cam = { s: 1, x: 0, y: 0 };
function toPath2D(polys) {
  const p = new Path2D(), S = Odb.SC;
  for (const r of polys) {
    if (!r.length) continue;
    p.moveTo(r[0].X / S, r[0].Y / S);
    for (let i = 1; i < r.length; i++) p.lineTo(r[i].X / S, r[i].Y / S);
    p.closePath();
  }
  return p;
}
function buildPreview() {
  const pv = result.preview;
  const get = n => pv.has(n) ? toPath2D(pv.get(n)) : null;
  const holes = new Path2D();
  for (const h of result.holes) {
    if (h.slot) {
      const a = -h.slot.angle * Math.PI / 180, L = Math.max(0, Math.max(h.slot.w, h.slot.h) - h.d) / 2;
      const along = h.slot.w >= h.slot.h ? a : a + Math.PI / 2;
      const dx = Math.cos(along) * L, dy = Math.sin(along) * L;
      holes.moveTo(h.x - dx + h.d / 2, h.y - dy);
      holes.arc(h.x - dx, h.y - dy, h.d / 2, 0, Math.PI * 2);
      holes.moveTo(h.x + dx + h.d / 2, h.y + dy);
      holes.arc(h.x + dx, h.y + dy, h.d / 2, 0, Math.PI * 2);
      const nx = -Math.sin(along) * h.d / 2, ny = Math.cos(along) * h.d / 2;
      holes.moveTo(h.x - dx + nx, h.y - dy + ny); holes.lineTo(h.x + dx + nx, h.y + dy + ny);
      holes.lineTo(h.x + dx - nx, h.y + dy - ny); holes.lineTo(h.x - dx - nx, h.y - dy - ny); holes.closePath();
    } else { holes.moveTo(h.x + h.d / 2, h.y); holes.arc(h.x, h.y, h.d / 2, 0, Math.PI * 2); }
  }
  paths = {
    edge: toPath2D(st.profile), holes,
    FCu: get('F.Cu'), BCu: get('B.Cu'), FMask: get('F.Mask'), BMask: get('B.Mask'), FSilk: get('F.SilkS'), BSilk: get('B.SilkS'),
  };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const all = st.profile.length ? st.profile : [...pv.values()].flat();
  for (const r of all) for (const p of r) { const x = p.X / Odb.SC, y = p.Y / Odb.SC; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  bounds = isFinite(x0) ? [x0, y0, x1, y1] : [0, 0, 10, 10];
  $('empty').style.display = 'none';
}
function fit() {
  if (!bounds) return;
  const r = cv.getBoundingClientRect();
  const w = bounds[2] - bounds[0], h = bounds[3] - bounds[1];
  cam.s = Math.min(r.width / (w * 1.08), r.height / (h * 1.08));
  cam.x = (bounds[0] + bounds[2]) / 2; cam.y = (bounds[1] + bounds[3]) / 2;
  draw();
}
function draw() {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!paths) return;
  const mx = view === 'B' ? -1 : 1;
  // screen = center + s * (mirror x, flip y)
  ctx.setTransform(dpr * cam.s * mx, 0, 0, -dpr * cam.s, dpr * (r.width / 2 - mx * cam.s * cam.x), dpr * (r.height / 2 + cam.s * cam.y));
  const fill = (p, c, a = 1, rule = 'evenodd') => { if (!p) return; ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fill(p, rule); };
  fill(paths.edge, '#1e2a22', 1, 'nonzero');
  if (view === 'F') { fill(paths.BCu, '#3a5bd0', .3); fill(paths.FCu, '#d8483a', .9); fill(paths.FMask, '#40b050', .22); fill(paths.FSilk, '#f2f2f2'); }
  else { fill(paths.FCu, '#d8483a', .25); fill(paths.BCu, '#4a6be0', .9); fill(paths.BMask, '#40b050', .22); fill(paths.BSilk, '#f2f2f2'); }
  fill(paths.holes, '#000000');
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1 / cam.s; ctx.strokeStyle = '#e0c040'; ctx.stroke(paths.edge);
}
new ResizeObserver(() => draw()).observe(cv);
$('viewTop').addEventListener('click', () => { view = 'F'; $('viewTop').setAttribute('aria-pressed', 'true'); $('viewBot').setAttribute('aria-pressed', 'false'); draw(); });
$('viewBot').addEventListener('click', () => { view = 'B'; $('viewBot').setAttribute('aria-pressed', 'true'); $('viewTop').setAttribute('aria-pressed', 'false'); draw(); });
$('viewFit').addEventListener('click', fit);
const mxv = () => view === 'B' ? -1 : 1;
function zoomAt(px, py, f) {
  const r = cv.getBoundingClientRect();
  const wx = cam.x + (px - r.width / 2) / (cam.s * mxv()), wy = cam.y - (py - r.height / 2) / cam.s;
  cam.s *= f;
  cam.x = wx - (px - r.width / 2) / (cam.s * mxv()); cam.y = wy + (py - r.height / 2) / cam.s;
  draw();
}
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
const ptrs = new Map();
let pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    cam.x -= (e.clientX - prev.x) / (cam.s * mxv()); cam.y += (e.clientY - prev.y) / cam.s; draw();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) { const r = cv.getBoundingClientRect(); zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch); }
    pinch = d;
  }
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
})();
</script>
